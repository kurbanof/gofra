@media(prefers-color-scheme:dark){:root{--bg:#0d1820;--ink:#eaf1f5;--mut:#9db0bd;--glass:rgba(255,255,255,.09);--card:rgba(255,255,255,.11);--edge:rgba(255,255,255,.2);--hi:rgba(255,255,255,.3);--sh:rgba(0,0,0,.5);--fld:rgba(255,255,255,.08);--flute:rgba(255,255,255,.03)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(var(--bg),transparent 12%,transparent 88%,var(--bg)),radial-gradient(60% 40% at 15% 8%,#e3a857aa,transparent 70%),radial-gradient(55% 40% at 95% 35%,#4fb3a9aa,transparent 70%),radial-gradient(60% 45% at 20% 95%,#7d9bd1aa,transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,var(--flute) 0 7px,transparent 7px 14px)}
.shell{position:fixed;inset:0;touch-action:pan-y}
.wrap{width:100%;max-width:560px;margin:0 auto}
.top,.dock{position:absolute;left:0;right:0;z-index:5;pointer-events:none}
.top{top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;transition:transform .3s cubic-bezier(.4,0,.2,1);will-change:transform}
.top.hide{transform:translateY(-150%)}
.top.hide .pill{pointer-events:none}
.top .pill{max-width:560px;margin:0 auto;pointer-events:auto}
.top::before,.dock::before{content:"";position:absolute;left:0;right:0;z-index:-1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .3s ease}
.top::before{top:0;height:calc(50px + env(safe-area-inset-top,0px));background:color-mix(in srgb,var(--bg) 45%,transparent);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(84px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px))}
.dock{bottom:0;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .pill{pointer-events:auto}
.dock::before{bottom:0;height:calc(55px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 45%,transparent);-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000);opacity:0}
.dock.on::before{opacity:1}
.dock-enter-active,.dock-leave-active{transition:opacity .3s ease,transform .3s ease}
.dock-enter-from,.dock-leave-to{opacity:0;transform:translateY(18px)}
.fin{margin:4px 0 8px}
.io{flex-wrap:wrap}.io .m{flex:1 1 100%}.io .btn{flex:1}
h1{font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;margin:18px 0 10px;font-weight:700}
.g{background:var(--noise),var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--edge);border-radius:24px;box-shadow:inset 0 1px 0 var(--hi),0 12px 32px var(--sh)}
.scroll .g{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--noise),var(--card);box-shadow:inset 0 1px 0 var(--hi),0 8px 22px var(--sh)}
.mut{color:var(--mut)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 16px}
.dt{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.dt svg{opacity:.55;flex:none}
.btn{font:inherit;font-weight:500;color:var(--ink);background:var(--fld);border:1px solid var(--edge);border-radius:16px;padding:12px 16px;cursor:pointer;min-height:46px}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.btn.pri{background:linear-gradient(180deg,#f0b967,#d8923a);color:#1a1206;border-color:#f6cf90;font-weight:700;box-shadow:inset 0 1px 0 #fff8,0 6px 18px #d8923a55}
.btn.big{width:100%;min-height:54px;font-size:18px;margin:6px 0 14px}
.btn.dng{color:#c0392b}
.btn:active{transform:scale(.98)}
:focus-visible{outline:3px solid #4fb3a9;outline-offset:2px}
.total{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;margin-bottom:14px}
.tl{flex:1;min-width:0;font-size:15px;line-height:1.25}
.tn{flex:none;white-space:nowrap;font-size:clamp(24px,8vw,34px);font-weight:700}
.tn small{font-size:16px;font-weight:500;color:var(--mut);margin-left:5px}
.oc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.oc .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(180deg,#f0b967,#d8923a);color:#1a1206}
.oc .m{flex:1;min-width:0}.oc .m b{display:block;overflow-wrap:anywhere}.oc small,.dc small,.item small,.sy small{display:block;color:var(--mut);font-size:13px}
.oc .a,.item .a{font-weight:700;white-space:nowrap}
.prev{padding:16px;margin-top:18px}
pre{margin:0 0 12px;white-space:pre-wrap;word-break:break-word;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--fld);border-radius:16px;padding:14px;max-height:340px;overflow:auto}
.chk{display:flex;gap:10px;align-items:center;margin:0 0 8px;font-size:14px;color:var(--mut)}
.chk input{width:20px;height:20px;accent-color:#d8923a}
.empty{padding:28px 22px;margin-top:20px}.empty p{color:var(--mut);margin:12px 0 18px}
.item,.sy,.dc{display:flex;align-items:center;gap:10px;padding:14px 16px;margin-bottom:10px}
.item .t,.sy .m,.dc .m{flex:1;min-width:0}.item .t{cursor:pointer}.item .t b{font-size:18px}.dc{cursor:pointer;padding:12px 14px}
.dc.sel{border-color:#d8923a;box-shadow:inset 0 1px 0 var(--hi),0 0 0 2px #d8923a88,0 12px 32px var(--sh)}
.mn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.mtot{padding:16px 18px;margin-bottom:14px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:10px}
.mg span{font-size:26px;font-weight:700;line-height:1.1}.mg small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.inst{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;margin-bottom:12px}.inst span{flex:1;font-size:14px;line-height:1.3}
.inst .x{background:none;border:0;color:var(--mut);font-size:22px;line-height:1;padding:6px 10px;cursor:pointer}
.pill{position:relative;display:flex;gap:4px;padding:5px;border-radius:999px}
.pill button{flex:1;position:relative;z-index:1;font:inherit;font-weight:500;font-size:15px;color:var(--mut);background:none;border:0;border-radius:999px;padding:11px 12px;cursor:pointer;transition:color .3s}
.pill.nav button{padding:11px 26px;flex:none}
.pill button.on{color:var(--ink)}
.drop{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--fld);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 4px 14px var(--sh);pointer-events:none;z-index:0;transform-origin:0 50%;will-change:transform}
.sl-enter-active,.sl-leave-active,.sr-enter-active,.sr-leave-active{transition:opacity .15s ease,transform .15s ease;will-change:opacity,transform}
.sl-leave-to,.sr-enter-from{opacity:0;transform:translateX(-28px)}
.sl-enter-from,.sr-leave-to{opacity:0;transform:translateX(28px)}
.li-enter-active,.li-leave-active{transition:opacity .3s ease,transform .3s ease}
.li-enter-from,.li-leave-to{opacity:0;transform:translateY(10px)}
.ov{position:fixed;inset:0;z-index:8;background:rgba(5,12,18,.35);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:9;width:min(100%,560px);max-height:calc(var(--vh,100dvh) - env(safe-area-inset-top,0px) - 12px);overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,105%);transition:transform .25s ease;will-change:transform}
.sheet.open{transform:translate(-50%,calc(var(--kb,0px)*-1))}
html.kbd .sheet{border-radius:28px;padding-bottom:18px}
.top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghost{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px 0}
.dim{color:var(--mut);min-width:40px;text-align:right}
.bar{height:5px;border-radius:5px;background:var(--fld);margin:10px 0 2px;overflow:hidden}.bar i{display:block;height:100%;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,#f0b967,#d8923a);transition:transform .3s}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:12px}
input:not([type=checkbox]){display:block;width:100%;margin-top:6px;font:inherit;font-size:24px;font-weight:500;color:var(--ink);background:var(--fld);border:1px solid var(--edge);border-radius:16px;padding:14px 16px}
.inw{display:block;position:relative}.inw input{padding-right:66px}
input.err{border-color:#d9534f;box-shadow:0 0 0 3px #d9534f44}
.calcb{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:14px;background:var(--fld);border:1px solid var(--edge);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi)}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 8px}
.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--fld);border:1px solid var(--edge);border-radius:999px;padding:10px 14px;cursor:pointer;text-align:left}
.info{margin:6px 0 4px;padding:12px 14px;border-radius:16px;background:var(--fld);font-size:15px}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}.row .btn.pri{flex:2}
.hint{font-size:13px;color:var(--mut);margin:0}
.calc{position:fixed;left:50%;top:50%;z-index:12;width:min(94vw,440px);padding:16px 12px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.calc.open{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.whr{display:flex;gap:2px;margin:10px 0}
.wh{flex:1;min-width:0;position:relative;z-index:0}
.whl{height:22px;line-height:18px;text-align:center;font-size:12px;color:var(--mut)}
.wh::after{content:"";position:absolute;left:2px;right:2px;top:110px;height:44px;border-radius:12px;background:var(--fld);border:1px solid var(--edge);z-index:-1}
.whs{height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.whs::-webkit-scrollbar{display:none}
.whp{height:88px}
.whi{height:44px;display:flex;align-items:center;justify-content:center;gap:2px;scroll-snap-align:center;font-size:21px;color:var(--mut);opacity:.7}
.whi.sel{color:var(--ink);font-size:27px;font-weight:500;opacity:1}
.whi small{font-size:11px;color:var(--mut)}
.res{text-align:center;font-size:18px}.res b{font-size:28px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:20;padding:12px 20px;border-radius:999px;font-weight:500;max-width:92vw;text-align:center;transition:transform .25s}
.toast.show{transform:translate(-50%,0)}
.steps{padding-left:22px;margin:0 0 6px;line-height:1.7}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="vue.global.prod.js"></script>
<script>window.Vue||document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"><\/script>')</script>
<script>
const {createApp,ref,reactive,computed,watch,onMounted,nextTick}=Vue;
const K='gofro-reports-v1',KS='gofro-sync-v1';
const now=()=>Date.now(),z2=n=>String(n).padStart(2,'0');
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const fmt=n=>n.toLocaleString('ru-RU',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate())};
const dm=d=>d.slice(8)+'.'+d.slice(5,7);
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MI=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const dayTxt=d=>(+d.slice(8))+' '+MN[+d.slice(5,7)-1];
const area=o=>num(o.len)*num(o.wid)*num(o.fact)/1e6;
const shiftM=(ym,n)=>{let y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+z2(m+1)};
const range=(a,b,f)=>Array.from({length:b-a+1},(_,i)=>f(a+i));
const STEPS=[
{t:'Имя заказчика',f:[{k:'customer',l:'Заказчик',m:'text'}]},
{t:'Номера',f:[{k:'order',l:'Номер заказа',m:'numeric'},{k:'tech',l:'Номер техкарты (если нет — оставьте пустым)',m:'numeric'}]},
{t:'Размеры заготовки, мм',f:[{k:'len',l:'Длина',m:'decimal'},{k:'wid',l:'Ширина',m:'decimal'}]},
{t:'Количество по заказу',f:[{k:'plan',l:'Нужно по заказу, шт',m:'numeric'}]},
{t:'Количество по факту',f:[{k:'fact',l:'Произведено, шт',m:'numeric'}]}];
const MODES=[{v:'day',t:'Ежедневный отчёт'},{v:'mon',t:'Отчёт за месяц'}],TABS=[{v:'rep',t:'Отчёт'},{v:'his',t:'История'}];
const IDX={rep:0,his:1,mon:2};
const TH={A:4.75,B:3,E:1.8};
const WN=range(1,40,v=>({v,t:v})),WS=range(1,20,v=>({v,t:v})),WF=['A','B','E'].map(v=>({v,t:v})),WH=range(10,220,v=>({v,t:v,u:'см'})),WL=[{v:0,t:'='}].concat(WH);

const D10=/^\d{4}-\d{2}-\d{2}$/,S=v=>v==null?'':String(v);
const cleanRep=r=>r&&typeof r==='object'&&S(r.id)&&D10.test(S(r.date))&&Array.isArray(r.orders)?{id:S(r.id),date:S(r.date),u:+r.u||0,orders:r.orders.filter(o=>o&&typeof o==='object').map(o=>({id:S(o.id)||uid(),customer:S(o.customer),order:S(o.order),tech:S(o.tech),len:S(o.len),wid:S(o.wid),plan:S(o.plan),fact:S(o.fact)}))}:null;
const cleanDay=x=>x&&typeof x==='object'&&D10.test(S(x.date))?{date:S(x.date),m2:S(x.m2),ord:S(x.ord),sh:S(x.sh),brak:S(x.brak)||'0',u:+x.u||0}:null;
const cleanCust=c=>{const n=S(typeof c==='string'?c:c&&c.n).trim().replace(/\s+/g,' ');return n?{n,u:c&&typeof c==='object'?+c.u||0:0}:null};
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
 d=d&&typeof d==='object'?d:{};
 d.reports=(d.reports||[]).map(r=>Object.assign({u:0},r));
 d.days=(d.days||[]).map(x=>Object.assign({u:0},x));
 d.customers=(d.customers||[]).map(c=>typeof c==='string'?{n:c,u:0}:c);
 d.cur=d.cur||null;d.mode=d.mode==='mon'?'mon':'day';d.wa=d.wa!==false;return d}
function mergeBy(L,R,key){
 const rm=new Map((R||[]).map(x=>[x[key],x])),lm=new Map(L.map(x=>[x[key],x]));let pull=false,push=false;
 for(const [k,r] of rm){const l=lm.get(k);if(!l||(r.u||0)>(l.u||0)){lm.set(k,r);pull=true}}
 for(const [k,l] of lm){const r=rm.get(k);if(!r||(l.u||0)>(r.u||0))push=true}
 return{list:pull?[...lm.values()]:null,push}}

const Pill={props:{items:Array,modelValue:String},emits:['update:modelValue'],
 setup(p){const el=ref(null);let l0=null,w0=null;
  function place(anim){const c=el.value;if(!c)return;const i=p.items.findIndex(x=>x.v===p.modelValue),b=c.querySelectorAll('button')[i],d=c.querySelector('.drop');
   if(!b||!b.offsetWidth)return;const L=b.offsetLeft,W=b.offsetWidth;
   d.style.left=L+'px';d.style.width=W+'px';
   if(anim&&l0!==null&&(l0!==L||w0!==W)&&d.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const lo=Math.min(l0,L),hi=Math.max(l0+w0,L+W),e='cubic-bezier(.4,0,.2,1)';
    d.animate([{transform:'translateX('+(l0-L)+'px) scale('+(w0/W)+',1)',easing:e},{transform:'translateX('+(lo-L)+'px) scale('+((hi-lo)/W)+',.88)',offset:.45,easing:e},{transform:'none'}],{duration:300})}
   l0=L;w0=W}
  watch(()=>p.modelValue,()=>nextTick(()=>place(true)));
  onMounted(()=>{place(false);if(window.ResizeObserver)new ResizeObserver(()=>place(false)).observe(el.value)});
  return{el}},
 template:'<div class="g pill" ref="el"><span class="drop"></span><button v-for="it in items" :key="it.v" :class="{on:it.v===modelValue}" @click="$emit(\'update:modelValue\',it.v)">{{it.t}}</button></div>'};

const Wheel={props:{items:Array,modelValue:null,label:String},emits:['update:modelValue'],
 setup(p,{emit}){const el=ref(null),H=44;
  const idx=()=>Math.max(0,p.items.findIndex(i=>i.v===p.modelValue));
  onMounted(()=>{el.value.scrollTop=idx()*H});
  function onScroll(){const i=Math.min(p.items.length-1,Math.max(0,Math.round(el.value.scrollTop/H))),v=p.items[i].v;if(v!==p.modelValue)emit('update:modelValue',v)}
  return{el,onScroll}},
 template:'<div class="wh"><div class="whl">{{label}}</div><div class="whs" ref="el" @scroll.passive="onScroll"><div class="whp"></div><div v-for="it in items" :key="it.v" class="whi" :class="{sel:it.v===modelValue}">{{it.t}}<small v-if="it.v===modelValue&&it.u">{{it.u}}</small></div><div class="whp"></div></div></div>'};

const App={components:{Pill,Wheel},
setup(){
 const db=reactive(load()),cfg=reactive(Object.assign({url:'',code:'',last:0},(()=>{try{return JSON.parse(localStorage.getItem(KS))||{}}catch(e){return{}}})()));
 const sync=reactive({busy:false,status:'',msg:''}),toast=reactive({msg:''}),armed=ref('');
 const tab=ref('rep'),tname=ref('sl'),scrollEl=ref(null),sheetEl=ref(null),fileEl=ref(null),topHidden=ref(false);
 const sheet=ref(''),open=ref(false),oc=ref(0),calcOpen=ref(false),syncInp=ref('');
 const W=reactive({mode:'new',step:0,id:null,err:'',o:{}}),dateF=reactive({isNew:false,v:'',err:false}),D=reactive({orig:null,date:'',m2:'',ord:'',sh:'',brak:'',err:''});
 const C=reactive({n:1,s:1,f:'B',h:100,l:0});
 const mMonth=ref(null),mSel=ref(null),dp=ref(null),instOff=ref(false);
 try{instOff.value=localStorage.getItem('gofro-inst-off')==='1'}catch(e){}

 const reports=computed(()=>db.reports.filter(r=>!r.del).sort((a,b)=>b.date.localeCompare(a.date)));
 const cur=computed(()=>db.reports.find(r=>r.id===db.cur&&!r.del)||null);
 const repTotal=r=>r.orders.reduce((s,o)=>s+area(o),0);
 const total=computed(()=>cur.value?repTotal(cur.value):0);
 const customers=computed(()=>db.customers.filter(c=>!c.del).map(c=>c.n));
 const view=computed(()=>db.mode==='mon'?'mon':tab.value);
 const repText=computed(()=>{const r=cur.value;if(!r||!r.orders.length)return'';let t='План на '+dm(r.date)+':\n\n';
  r.orders.forEach((o,i)=>{t+=(i+1)+'. '+o.customer+' '+o.order+'/'+(o.tech||'-')+'\n        '+o.len+'×'+o.wid+'. '+o.plan+'шт\n\n'});
  t+='По факту:\n\n';r.orders.forEach((o,i)=>{t+=(i+1)+'. '+o.fact+'\n'});
  if(db.wa)t+='\nПроизведено: '+fmt(total.value)+' м²';return t});
 const days=computed(()=>db.days.filter(x=>!x.del));
 const monthKey=computed(()=>mMonth.value||(days.value.map(x=>x.date).sort().pop()||today()).slice(0,7));
 const monthTitle=computed(()=>MI[+monthKey.value.slice(5)-1]+' '+monthKey.value.slice(0,4));
 const mdays=computed(()=>days.value.filter(x=>x.date.indexOf(monthKey.value)===0).sort((a,b)=>a.date.localeCompare(b.date)));
 const mdaysDesc=computed(()=>[...mdays.value].reverse());
 const selDay=computed(()=>mdays.value.find(x=>x.date===mSel.value)||mdays.value[mdays.value.length-1]||null);
 const cum=up=>mdays.value.filter(x=>x.date<=up).reduce((s,x)=>({m2:s.m2+num(x.m2),ord:s.ord+num(x.ord),sh:s.sh+num(x.sh),brak:s.brak+num(x.brak)}),{m2:0,ord:0,sh:0,brak:0});
 const mTot=computed(()=>cum('9999'));
 const mText=computed(()=>{const d=selDay.value;if(!d)return'';const ym=d.date.slice(0,7);
  const blk=(h,o)=>h+'\nКоличество: '+fmt(num(o.m2))+' м²\nЗаказов: '+fmt(num(o.ord))+'\nСмен: '+fmt(num(o.sh))+'\nБрак: '+fmt(num(o.brak))+' кг';
  return'Гофроагрегат\n\n'+blk((d.date===today()?'За сегодня, ':'За ')+dayTxt(d.date)+':',d)+'\n\n'+blk('За '+MI[+ym.slice(5)-1].toLowerCase()+' '+ym.slice(0,4)+':',cum(d.date))});
 const shiftMonth=n=>{mMonth.value=shiftM(monthKey.value,n);mSel.value=null};
 const dayTotals=r=>{const rs=db.reports.filter(x=>!x.del&&x.date===r.date);return{m2:Math.round(rs.reduce((s,x)=>s+repTotal(x),0)*100)/100,ord:rs.reduce((s,x)=>s+x.orders.length,0)}};
 const finState=computed(()=>{const r=cur.value;if(!r)return'';const e=days.value.find(x=>x.date===r.date);if(!e)return'new';const t=dayTotals(r);return Math.abs(num(e.m2)-t.m2)<.005&&num(e.ord)===t.ord?'ok':'stale'});
 const finLabel=computed(()=>({new:'Закончить отчёт',stale:'Обновить в месячном отчёте',ok:'Сохранено в месячном отчёте ✓'})[finState.value]||'');
 function finishReport(){const r=cur.value;if(!r||!r.orders.length)return;const t=dayTotals(r),m2=String(t.m2),ord=String(t.ord),ex=db.days.find(x=>x.date===r.date);
  if(ex&&!ex.del){ex.m2=m2;ex.ord=ord;ex.u=now()}else if(ex)Object.assign(ex,{m2,ord,sh:'1',brak:'0',del:false,u:now()});else db.days.push({date:r.date,m2,ord,sh:'1',brak:'0',u:now()});
  mMonth.value=r.date.slice(0,7);mSel.value=r.date;say('В месячном отчёте: '+fmt(t.m2)+' м², заказов: '+t.ord)}

 let tt;const say=m=>{toast.msg=m;clearTimeout(tt);tt=setTimeout(()=>{toast.msg=''},3500)};
 async function copy(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(x){}a.remove()}say(ok?'Скопировано':'Не удалось скопировать — выделите текст вручную')}
 const sure=(k,fn)=>{if(armed.value===k){armed.value='';fn()}else{armed.value=k;setTimeout(()=>{if(armed.value===k)armed.value=''},3000)}};

 const show=k=>{sheet.value=k;oc.value++;open.value=true};
 const close=()=>{const a=document.activeElement;if(a&&a.blur)a.blur();open.value=false;calcOpen.value=false};
 function addCust(n){const l=n.toLowerCase(),c=db.customers.find(x=>x.n.toLowerCase()===l);if(c){if(c.del){c.del=false;c.u=now()}}else db.customers.push({n,u:now()})}
 const delCust=n=>{const c=db.customers.find(x=>x.n===n);if(c){c.del=true;c.u=now()}};
 function exportData(){
  const data={app:'gofro-otchet',v:1,t:now(),reports:db.reports.filter(r=>!r.del),days:db.days.filter(x=>!x.del),customers:db.customers.filter(c=>!c.del)};
  if(!data.reports.length&&!data.days.length&&!data.customers.length){say('Пока нечего экспортировать');return}
  const name='otchet-backup-'+today()+'.json';
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);say('Экспорт: '+name)}catch(e){say('Не удалось создать файл')}}
 function importData(d){
  const cnt={reports:0,days:0,customers:0};
  for(const [k,key,clean] of [['reports','id',cleanRep],['days','date',cleanDay],['customers','n',cleanCust]]){
   for(const raw of (Array.isArray(d[k])?d[k]:[])){
    if(raw&&raw.del)continue;const r=clean(raw);if(!r)continue;
    const l=db[k].find(x=>k==='customers'?x.n.toLowerCase()===r.n.toLowerCase():x[key]===r[key]);
    if(!l){db[k].push(Object.assign(r,{u:now()}));cnt[k]++}
    else if(l.del||(k!=='customers'&&r.u>(l.u||0))){Object.assign(l,r,{del:false,u:now()});cnt[k]++}}}
  if(!cur.value&&reports.value.length)db.cur=reports.value[0].id;
  return cnt}
 const pickFile=()=>{if(fileEl.value)fileEl.value.click()};
 async function onFile(e){const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());
   if(!d||typeof d!=='object'||Array.isArray(d)||!(Array.isArray(d.reports)||Array.isArray(d.days)||Array.isArray(d.customers)))throw new Error('format');
   const c=importData(d);
   say(c.reports+c.days+c.customers?'Импорт: отчётов '+c.reports+', дней '+c.days+', заказчиков '+c.customers:'В файле нет новых данных')}
  catch(err){say('Не удалось прочитать файл: нужен файл экспорта (.json)')}}

 function openDate(isNew){dateF.isNew=isNew;dateF.v=isNew?today():cur.value.date;dateF.err=false;show('date')}
 function dateOk(){if(!dateF.v){dateF.err=true;return}
  if(dateF.isNew){const r={id:uid(),date:dateF.v,orders:[],u:now()};db.reports.push(r);db.cur=r.id;tab.value='rep';db.mode='day';openOrder()}
  else{cur.value.date=dateF.v;cur.value.u=now();close()}}
 function openReport(id){db.cur=id;tab.value='rep'}
 function delReport(id){const r=db.reports.find(x=>x.id===id);if(r){r.del=true;r.u=now()}if(db.cur===id)db.cur=null}

 const shownSteps=computed(()=>W.mode==='edit'?STEPS:[STEPS[W.step]]);
 const showArea=computed(()=>W.mode==='edit'||W.step===STEPS.length-1);
 const nextLabel=computed(()=>W.mode==='edit'?'Сохранить':W.step===STEPS.length-1?'Завершить заказ':'Далее');
 const sugs=computed(()=>{const q=(W.o.customer||'').trim().toLowerCase(),l=customers.value;
  const r=q?l.filter(c=>{const s=c.toLowerCase();return s!==q&&s.indexOf(q)>-1}).sort((a,b)=>(a.toLowerCase().indexOf(q)===0?0:1)-(b.toLowerCase().indexOf(q)===0?0:1)||a.localeCompare(b,'ru')):[...l].reverse();return r.slice(0,6)});
 function openOrder(id){const r=cur.value,ex=id&&r.orders.find(x=>x.id===id);
  Object.assign(W,{mode:ex?'edit':'new',step:0,id:id||null,err:'',o:ex?Object.assign({},ex):{customer:'',order:'',tech:'',len:'',wid:'',plan:'',fact:''}});show('order')}
 function next(){
  const bad=shownSteps.value.flatMap(s=>s.f).find(f=>f.k!=='tech'&&!String(W.o[f.k]).trim());
  if(bad){W.err=bad.k;nextTick(()=>{const e=sheetEl.value.querySelector('input.err');e&&e.focus()});return}
  if(W.mode==='new'&&W.step<STEPS.length-1){W.step++;return}
  const o=Object.assign({},W.o),r=cur.value;if(!r)return;
  o.customer=o.customer.trim().replace(/\s+/g,' ');const kn=customers.value.find(c=>c.toLowerCase()===o.customer.toLowerCase());if(kn)o.customer=kn;
  ['order','tech','len','wid','plan','fact'].forEach(k=>{o[k]=String(o[k]).replace(/\s+/g,'')});
  const ex=W.mode==='edit'&&r.orders.find(x=>x.id===W.id);
  if(ex)Object.assign(ex,o);else r.orders.push(Object.assign({id:uid()},o));
  r.u=now();addCust(o.customer);close();say((ex?'Сохранено: ':'Заказ завершён: ')+fmt(area(o))+' м²')}
 const back=()=>{if(W.step>0)W.step--};
 const pick=c=>{W.o.customer=c;if(W.mode==='new')next()};
 const delOrder=()=>{const r=cur.value;r.orders=r.orders.filter(x=>x.id!==W.id);r.u=now();close()};

 function openDay(date){const ex=date&&days.value.find(x=>x.date===date);
  Object.assign(D,{orig:ex?ex.date:null,err:''},ex?{date:ex.date,m2:ex.m2,ord:ex.ord,sh:ex.sh,brak:ex.brak}:{date:today(),m2:'',ord:'',sh:'',brak:''});show('day')}
 function dayOk(){const g=k=>String(D[k]).trim().replace(/\s+/g,''),o={date:g('date'),m2:g('m2'),ord:g('ord'),sh:g('sh'),brak:g('brak')||'0',u:now()};
  const bad=['date','m2','ord','sh'].find(k=>!o[k]);if(bad){D.err=bad;return}
  if(D.orig!==o.date&&days.value.some(x=>x.date===o.date)){say('За эту дату уже есть запись. Откройте её кнопкой «Изменить»');return}

 const calcTotal=computed(()=>{const per=h=>Math.floor(h*10/TH[C.f]),full=per(C.h),last=C.n>1&&C.l?per(C.l):full;return C.s*((C.n-1)*full+last)});

 function syncConnect(){const s=syncInp.value.trim();let u='',c='';
  try{if(s.indexOf('gofro:')===0){const k=JSON.parse(atob(s.slice(6)));u=k.u;c=k.c}else if(/^https?:\/\//.test(s)){u=s;c=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,'0')).join('')}}catch(e){}

   for(const [k,key] of [['reports','id'],['days','date'],['customers','n']]){const m=mergeBy(db[k],remote&&remote[k],key);if(m.list)db[k]=m.list;if(m.push)push=true}
   if(!cur.value&&reports.value.length)db.cur=reports.value[0].id;

  const ins=[...sheetEl.value.querySelectorAll('input:not([type=date])')],i=ins.indexOf(e.target);

 function backStep(){

  if(open.value){if(sheet.value==='order'&&W.mode==='new'&&W.step>0)W.step--;else close();return}

  <div class="top2"><button class="ghost" @click="calcOpen=false">Закрыть</button><b>Калькулятор</b><span class="dim"></span></div>
  <div class="whr">

app.directive('focus',{mounted(el,b){if(b.value&&el.type!=='date')el.focus({preventScroll:true})}});

const openOrd=r=>{const o=r&&r.orders[r.orders.length-1];return o&&(o.op==='1'||o.op==='2')&&num(o.fact)<num(o.plan)?o:null};

const range=(a,b,f)=>Array.from({length:b-a+1},(_,i)=>f(a+i));
const STEPS=[

const TT={B:30,E:18};
const WN=range(1,40,v=>({v,t:v})),WS=range(1,4,v=>({v,t:v})),WF=['A','B','E'].map(v=>({v,t:v})),WH=range(10,220,v=>({v,t:v})),WL=[{v:0,t:'='}].concat(WH),WT=range(40,50,v=>({v,t:(v/10).toFixed(1).replace('.',',')}));

const D10=/^\d{4}-\d{2}-\d{2}$/,S=v=>v==null?'':String(v);
const cleanRep=r=>r&&typeof r==='object'&&S(r.id)&&D10.test(S(r.date))&&Array.isArray(r.orders)?{id:S(r.id),date:S(r.date),u:+r.u||0,waste:S(r.waste),orders:r.orders.filter(o=>o&&typeof o==='object').map(o=>({id:S(o.id)||uid(),customer:S(o.customer),order:S(o.order),tech:S(o.tech),len:S(o.len),wid:S(o.wid),plan:S(o.plan),fact:S(o.fact),bq:S(o.bq),bw:S(o.bw),op:S(o.op)}))}:null;
const cleanDay=x=>x&&typeof x==='object'&&D10.test(S(x.date))?{date:S(x.date),m2:S(x.m2),ord:S(x.ord),sh:S(x.sh),brak:S(x.brak),ba:x.ba===true,u:+x.u||0}:null;
const arr=v=>Array.isArray(v)?v:v&&typeof v==='object'?Object.values(v):[];
const fixOrd=o=>({id:S(o.id)||uid(),customer:S(o.customer),order:S(o.order),tech:S(o.tech),len:S(o.len),wid:S(o.wid),plan:S(o.plan),fact:S(o.fact),bq:S(o.bq),bw:S(o.bw),op:S(o.op)});
const fixRep=r=>r&&typeof r==='object'&&S(r.id)&&D10.test(S(r.date))?Object.assign({},r,{id:S(r.id),date:S(r.date),u:+r.u||0,waste:S(r.waste),orders:arr(r.orders).filter(o=>o&&typeof o==='object').map(fixOrd)}):null;
const fixDay=x=>x&&typeof x==='object'&&D10.test(S(x.date))?Object.assign({},x,{date:S(x.date),m2:S(x.m2),ord:S(x.ord),sh:S(x.sh),brak:S(x.brak),u:+x.u||0}):null;
const fixCust=c=>{if(typeof c==='string')c={n:c,u:0};if(!c||typeof c!=='object')return null;const n=S(c.n).trim();return n?Object.assign({},c,{n,u:+c.u||0}):null};

const cleanPlan=x=>x&&typeof x==='object'&&PM.test(S(x.month))&&num(x.m2)>0?{month:S(x.month),m2:S(x.m2),u:+x.u||0}:null;
const dimOf=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();

const cleanCust=c=>{const n=S(typeof c==='string'?c:c&&c.n).trim().replace(/\s+/g,' ');return n?{n,u:c&&typeof c==='object'?+c.u||0:0}:null};

function mergeBy(L,R,key){
 const rm=new Map((R||[]).map(x=>[x[key],x])),lm=new Map(L.map(x=>[x[key],x]));let pull=false,push=false;
 for(const [k,r] of rm){const l=lm.get(k);if(!l||(r.u||0)>(l.u||0)){lm.set(k,r);pull=true}}
 for(const [k,l] of lm){const r=rm.get(k);if(!r||(l.u||0)>(r.u||0))push=true}
 return{list:pull?[...lm.values()]:null,push}}

// ---- import of a report pasted as text ("План на 05.10 ... По факту ...")
function impDate(str,nowD){const m=/(\d{1,2})\s*[.\-\/]\s*(\d{1,2})(?:\s*[.\-\/]\s*(\d{2,4}))?/.exec(str||'');if(!m)return null;
 const d=+m[1],mo=+m[2];if(d<1||d>31||mo<1||mo>12)return null;
 let y=m[3]?+m[3]:nowD.getFullYear();if(m[3]&&y<100)y+=2000;
 if(!m[3]&&new Date(y,mo-1,d)-nowD>60*864e5)y--;
 const t=new Date(y,mo-1,d);if(t.getMonth()!==mo-1)return null;
 return y+'-'+z2(mo)+'-'+z2(d)}
function impItem(t,lax){
 const P=[...t.matchAll(/(\d+)\s*[\/:×xх*]\s*([A-Za-z]?\d+[A-Za-z]?|-)/gi)];if(!P.length)return null;
 const b=P[P.length-1];if(!/^\d+$/.test(b[2]))return null;
 let cust,ord,tech;
 if(P.length>=2){const a=P[0];cust=t.slice(0,a.index);ord=a[1];tech=a[2]==='-'?'':a[2].toUpperCase()}
 else{const m=/^(.*?)\s*(\d{3,7})\s*$/.exec(t.slice(0,b.index));if(!m)return null;cust=m[1];ord=m[2];tech=''}
 const tk=t.slice(b.index+b[0].length).split(/\s+/).filter(x=>x&&!/^[.,;:·•-]+$/.test(x));
 if(tk.length&&/^(шт|штук)\.?$/i.test(tk[tk.length-1]))tk.pop();
 const last=tk.pop(),q=last==null?null:/^(\d+)(?:шт|штук)?\.?$/i.exec(last);if(!q&&!lax)return null;
 let plan=q?q[1]:'';
 while(q&&tk.length&&/^\d{1,3}$/.test(tk[tk.length-1])&&plan.length===3){plan=tk.pop()+plan}
 cust=cust.replace(/^[\s.·•,;:-]+|[\s.·•,;:-]+$/g,'').replace(/\s+/g,' ');
 if(!cust)return null;
 return{customer:cust,order:ord,tech,len:b[1],wid:b[2],plan}}
function parseImport(text,nowD){
 nowD=nowD||new Date();
 const R={date:null,factDate:null,items:[],bad:[],extraFacts:[]},raw=[],facts={};
 let sec=0,plan=false,exp=1,cur=null;
 for(const l0 of String(text||'').replace(/[   ]/g,' ').replace(/\r/g,'').split('\n')){const l=l0.trim();if(!l)continue;
  if(/^план(?![а-яё])/i.test(l)){sec=1;plan=true;R.date=R.date||impDate(l,nowD);continue}
  if(/^по\s*факт/i.test(l)){sec=2;R.factDate=R.factDate||impDate(l,nowD);continue}
  if(/^(произведено|итого)/i.test(l))continue;
  if(!sec)sec=1;
  if(sec===1){const m=/^(\d{1,3})\s*[).]\s*(.*)$/.exec(l);
   if(m&&+m[1]===exp){cur={n:exp,lines:[m[2]]};raw.push(cur);exp++}else if(cur)cur.lines.push(l)}
  else{const m=/^(\d{1,3})(?:\s*[).:\-]\s*|\s+)(\d[\d ]*)\s*(?:шт\.?|штук)?\.?\s*$/i.exec(l);if(m)facts[+m[1]]=m[2].replace(/ /g,'')}}
 for(const it of raw){
  const t=it.lines.map(x=>x.replace(/^[\s.·•]+/,'').trim()).filter(Boolean).join(' ').replace(/\s+/g,' '),o=impItem(t);
  if(o){o.n=it.n;o.fact=facts[it.n]!=null?facts[it.n]:'';R.items.push(o)}else R.bad.push({n:it.n,raw:t.slice(0,70)})}
 R.extraFacts=Object.keys(facts).map(Number).filter(n=>!raw.some(r=>r.n===n));
 return R}
// one order out of free text: own "copy order" format, a line of the report list, or a message
// "Денеб ООО 1085/574 / 1449×1279. 5200шт / Вес заготовки: 523,5 г"; the plan is read too, weight of one blank is optional
function parseOne(text){
 const raw=String(text||'').replace(/[   ]/g,' ').replace(/\r/g,'');let bw='';
 const body=raw.replace(/(?<![A-Za-zА-Яа-яЁё])вес(?:\s+(?:одной|1)?\s*(?:заготовки|заготовка|шт))?\s*[:=\-–]?\s*(\d+(?:[.,]\d+)?)(?:\s*(кг|грамм[а-яё]*|гр|г)(?![а-яё]))?/i,(m,n,u)=>{
  bw=/^кг/i.test(u||'')?String(Math.round(parseFloat(n.replace(',','.'))*1e5)/100).replace('.',','):n;return ' '});
 const lines=body.split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!/^(план(?![а-яё])|по\s*факт|произведено|итого|брак)/i.test(x));
 const first=[];let more=false;
 for(const l of lines){const m=/^(\d{1,3})\s*[).]\s*(.*)$/.exec(l);
  if(m&&first.length&&+m[1]>1){more=true;break}
  first.push(m&&!first.length&&+m[1]===1?m[2]:l)}
 const t=first.map(x=>x.replace(/^[\s.·•]+/,'').trim()).filter(Boolean).join(' '),o=t?impItem(t,true):null;
 return o?{customer:o.customer,order:o.order,tech:o.tech,len:o.len,wid:o.wid,plan:o.plan,bw,more}:null}
const nk=v=>String(v).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m+n;let p=Array.from({length:n+1},(_,j)=>j);
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const near=(a,b)=>{const x=nk(a),y=nk(b);if(x===y)return true;const L=Math.min(x.length,y.length);return L>=8&&Math.abs(x.length-y.length)<=2&&lev(x,y)<=(L>=12?2:1)};
function canonNames(names,known){const cnt=new Map();names.forEach(n=>cnt.set(n,(cnt.get(n)||0)+1));

  let c=known.find(k=>nk(k)===nk(n))||known.find(k=>near(k,n))||canon.find(k=>near(k,n));
  if(!c){c=n;canon.push(n)}map.set(n,c)}

// history search: every word has to be found in the customer, the order number (also "order/tech") or the sizes (L×W or W×L)
const lcq=v=>String(v==null?'':v).toLowerCase().replace(/ё/g,'е');
const hTok=q=>lcq(q).replace(/(\d)\s*[x×х*]\s*(\d)/g,'$1×$2').split(/\s+/).filter(Boolean);
function ordHit(o,tk){const f=[lcq(o.customer),lcq(o.order),lcq(o.len)+'×'+lcq(o.wid),lcq(o.wid)+'×'+lcq(o.len)],ot=lcq(o.order)+'/'+(lcq(o.tech)||'-');return tk.every(t=>t.includes('/')?ot.includes(t):f.some(x=>x.includes(t)))}
// order memory for auto-fill: sizes, tech cards and blank weights seen in earlier reports, newest first
const LATIN={'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X','У':'Y'};
const techK=t=>S(t).toUpperCase().replace(/[АВЕКМНОРСТХУ]/g,c=>LATIN[c]).replace(/[^A-Z0-9]/g,'');
const sizeK=(l,w)=>num(l)+'×'+num(w);
function memBuild(reports){
 const M={ord:new Map(),techs:new Map(),tech:new Map(),bwTS:new Map(),bwS:new Map(),freq:new Map()};
 const rs=reports.filter(r=>r&&!r.del&&r.orders&&r.orders.length).sort((a,b)=>S(b.date).localeCompare(S(a.date))||(b.u||0)-(a.u||0));
 for(const r of rs)for(let i=r.orders.length-1;i>=0;i--){
  const o=r.orders[i];if(!num(o.len)||!num(o.wid))continue;
  const tk=techK(o.tech),sk=sizeK(o.len,o.wid),ck=nk(o.customer)+'|'+nk(o.order),rec={date:r.date,tech:S(o.tech).trim(),len:S(o.len).trim(),wid:S(o.wid).trim()};
  if(nk(o.order)){if(!M.ord.has(ck+'|'+tk))M.ord.set(ck+'|'+tk,rec);if(tk){let l=M.techs.get(ck);if(!l)M.techs.set(ck,l=new Map());if(!l.has(tk))l.set(tk,rec)}}
  if(tk){let t=M.tech.get(tk);if(!t)M.tech.set(tk,t=new Map());if(!t.has(sk))t.set(sk,rec)}
  if(num(o.bw)>0){const bw=S(o.bw).trim(),v=num(o.bw);
   for(const [m,k] of [[M.bwTS,tk&&tk+'|'+sk],[M.bwS,sk]]){if(!k)continue;const e=m.get(k);if(e){e.lo=Math.min(e.lo,v);e.hi=Math.max(e.hi,v)}else m.set(k,{bw,date:r.date,lo:v,hi:v})}}
  const f=M.freq.get(sk);if(f)f.n++;else M.freq.set(sk,{len:rec.len,wid:rec.wid,n:1,date:r.date})}

// o = the order being typed. techs: tech cards this customer+order had before (newest first, to pick from, never filled silently);
// size: from the same customer+order+tech, else from the tech card itself; list: every size that tech card had (only when several);
// top: most frequent sizes when nothing matched
function memFind(M,o){
 const hasO=!!nk(o.order),ck=nk(o.customer)+'|'+nk(o.order),tk=techK(o.tech),out={techs:[],size:null,list:[],top:[]};
 if(hasO){const l=M.techs.get(ck);if(l)out.techs=[...l.values()].slice(0,5).map(x=>({v:x.tech,date:x.date}))}
 const ex=hasO?M.ord.get(ck+'|'+tk):null,T=tk?M.tech.get(tk):null;

      <div v-if="s.f[0].k==='bq'" class="info brk" :class="{bad:W.err==='bq'||W.err==='bw'}"><template v-if="W.err==='bq'||W.err==='bw'">Укажите вес одной заготовки или очистите количество брака.</template><template v-else>Брак: <b>{{ fmt(brakNow) }} кг</b><span v-if="W.auto.bw" class="mut"> · {{ bwNote }}</span></template></div>
      <div v-if="s.f[0].k==='customer'" class="sug"><button v-if="W.mode==='new'" type="button" class="chip paste" @click="pasteOrder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Вставить</button><button v-for="c in sugs" :key="c" type="button" class="chip" @click="pick(c)">{{ c }}</button></div>
      <div v-if="s.f[0].k==='order'&&techChips.length" class="sug"><span class="cl">Техкарты</span><button v-for="c in techChips" :key="c.v" type="button" class="chip" :class="{on:techK(c.v)===techK(W.o.tech)}" @click="pickTech(c)">{{ c.v }}</button></div>
      <div v-if="s.f[0].k==='len'&&sizeChips.length" class="sug"><span v-if="!W.auto.list.length" class="cl">Частые</span><button v-for="z in sizeChips" :key="z.len+'×'+z.wid" type="button" class="chip" :class="{on:z.len===W.o.len&&z.wid===W.o.wid}" @click="pickSize(z)">{{ z.len }}×{{ z.wid }}</button></div>
      <div v-else-if="s.f[0].k==='len'&&sizeNote" class="info">{{ sizeNote }}</div>
     </div>
     <label v-if="W.mode==='new'&&s.f.length<2" class="ph" aria-hidden="true">&nbsp;<span class="inw"><input tabindex="-1" disabled></span></label>
    </div>
   </TransitionGroup></div>
   <div class="row"><button v-if="W.mode==='new'" class="btn" :class="{inv:W.step===0}" :tabindex="W.step===0?-1:0" :aria-hidden="W.step===0" @click="back">Назад</button><button class="btn pri" @click="next">{{ nextLabel }}</button></div>
   </template>
   <template v-else>
    <div v-if="W.mode==='fact'" class="info fsum"><b>{{ W.o.customer }} {{ W.o.order }}/{{ W.o.tech||'-' }}</b><small>{{ W.o.len }}×{{ W.o.wid }} · план {{ W.o.plan }} шт</small></div>
    <div class="flat" :class="{st:three,one:oneNew,fm:W.mode==='fact'}">
     <template v-for="g in GROUPS" :key="g.id">
      <button v-if="g.id==='c'&&oneNew" type="button" class="sech mini" :class="{on:W.more}" :aria-expanded="W.more" @click="toggleMore"><span>Факт и брак<small>{{ !W.more&&W.o.fact?'факт '+W.o.fact:'можно позже' }}</small></span><i class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></i></button>
      <div class="gf" :class="{off:!gOn[g.id],fd:g.id==='c'}" :data-g="g.id" :inert="gOn[g.id]?null:''"><div class="gi">
       <h2 v-if="gHead[g.id]">{{ g.t }}<small v-if="g.id==='c'&&three" class="mut"> · можно пропустить</small></h2>
       <template v-for="(rw,ri) in g.rows" :key="ri">
        <div class="frow" :class="{two:rw.f.length>1}">
         <label v-for="k in rw.f" :key="k">{{ FL[k] }}
          <span class="inw"><input v-model="W.o[k]" :data-k="k" :class="{err:W.err===k}" inputmode="text" :enterkeyhint="k===lastK?'done':'next'" :autocapitalize="k==='customer'?'words':k==='tech'?'characters':'off'" :placeholder="k==='tech'?'можно пусто':''" autocomplete="off" autocorrect="off" spellcheck="false" v-focus="k===focusK0" @input="onType(k)" @change="onCommit(k)" @paste="k==='customer'&&onPaste($event)">
          <button v-if="k==='fact'" type="button" class="calcb" @click="openCalc" aria-label="Калькулятор заготовок"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" stroke-width="2.4"/></svg></button></span>
         </label>
        </div>
        <div v-if="rw.x==='cust'" class="sug"><button v-if="W.mode==='new'" type="button" class="chip paste" @click="pasteOrder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1.5"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Вставить</button><button v-for="c in sugs" :key="c" type="button" class="chip" @click="pick(c)">{{ c }}</button></div>
        <div v-else-if="rw.x==='tech'&&techChips.length" class="sug"><span class="cl">Техкарты</span><button v-for="c in techChips" :key="c.v" type="button" class="chip" :class="{on:techK(c.v)===techK(W.o.tech)}" @click="pickTech(c)">{{ c.v }}</button></div>
        <div v-else-if="rw.x==='size'&&sizeChips.length" class="sug"><span v-if="!W.auto.list.length" class="cl">Частые</span><button v-for="z in sizeChips" :key="z.len+'×'+z.wid" type="button" class="chip" :class="{on:z.len===W.o.len&&z.wid===W.o.wid}" @click="pickSize(z)">{{ z.len }}×{{ z.wid }}</button></div>
        <div v-else-if="rw.x==='size'&&sizeNote" class="info">{{ sizeNote }}</div>
        <div v-else-if="rw.x==='area'" class="info">Площадь: <b>{{ fmt(area(W.o)) }} м²</b></div>
        <div v-else-if="rw.x==='brk'" class="info brk" :class="{bad:W.err==='bq'||W.err==='bw'}"><template v-if="W.err==='bq'||W.err==='bw'">Укажите вес одной заготовки или очистите количество брака.</template><template v-else>Брак: <b>{{ fmt(brakNow) }} кг</b><span v-if="W.auto.bw" class="mut"> · {{ bwNote }}</span></template></div>
       </template>
       <button v-if="g.id==='b'&&three" type="button" class="btn skip" @click="saveNow">Добавить без факта и брака</button>
      </div></div>
     </template>
    </div>
    <div v-if="three" class="row"><button class="btn" :class="{inv:W.step===0}" :tabindex="W.step===0?-1:0" :aria-hidden="W.step===0" @click="back">Назад</button><button class="btn pri" @click="next">{{ W.step===2?'Добавить заказ':'Далее' }}</button></div>
    <div v-if="oneNew" class="row"><button class="btn" @click="saveMore">Добавить и ещё</button><button class="btn pri" @click="next">Добавить</button></div>
    <div v-if="W.mode==='edit'" class="row"><button class="btn pri" @click="next">Сохранить</button></div>
    <div v-if="W.mode==='fact'" class="row"><button class="btn" :class="{inv:W.qi===0}" :tabindex="W.qi===0?-1:0" :aria-hidden="W.qi===0" @click="factNext(-1)">Назад</button><button class="btn pri" @click="next">{{ W.qi===W.q.length-1?'Готово':'Далее' }}</button></div>
   </template>
   <div v-if="W.mode==='edit'" class="row"><button class="btn" @click="copyOrder">Скопировать заказ</button></div>
   <div v-if="W.mode==='edit'" class="row"><button class="btn dng" @click="sure('o',delOrder)">{{ armed==='o'?'Нажмите ещё раз':'Удалить заказ' }}</button></div>
  </template>
  <template v-else-if="sheet==='nofact'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>Завершение отчёта</b><span></span></div>
   <h2>Нет факта</h2>
   <div class="tot2">Заказов без факта: <b>{{ nfN }}</b>. В отчёт они войдут как 0 м².</div>
   <div class="row"><button class="btn" @click="finishNow">Закончить так</button><button class="btn pri" @click="openFacts">Ввести факт</button></div>
  </template>
  <template v-else-if="sheet==='unf'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>Последний заказ</b><span></span></div>
   <h2>Заказ завершён?</h2>
   <div v-if="lastOrd" class="tot2"><b>{{ lastOrd.customer }} {{ lastOrd.order }}/{{ lastOrd.tech||'-' }}</b><br>План: <b>{{ fmt(num(lastOrd.plan)) }}</b> шт · сделано: <b>{{ fmt(num(lastOrd.fact)) }}</b> шт<br>Осталось: <b>{{ fmt(unfLeft) }}</b> шт</div>
   <div class="row"><button class="btn" @click="finAns(false)">Нет, не завершён</button><button class="btn pri" @click="finAns(true)">Да, завершён</button></div>
   <p class="hint" style="margin-top:12px">«Да» — всё как обычно. «Нет» — заказ не войдёт в количество заказов в месячном отчёте, а остаток ({{ fmt(unfLeft) }} шт) станет планом этого заказа в следующем новом отчёте.</p>
  </template>
  <template v-else-if="sheet==='waste'">
   <div class="top2"><button class="ghost" @click="WA.q?show('unf'):close()">{{ WA.q?'Назад':'Отмена' }}</button><b>Завершение отчёта</b><span></span></div>
   <h2>Отходы</h2>
   <label>Отходы, кг<span class="inw"><input v-model="WA.v" :class="{err:WA.err}" inputmode="decimal" enterkeyhint="done" placeholder="необязательно" autocomplete="off" v-focus="true" @input="WA.err=false"></span></label>
   <div class="info brk" :class="{bad:WA.err}"><template v-if="WA.err">Введите число, например 12,5</template><template v-else>Брак за смену: <b>{{ fmt(wasteSum) }} кг</b><small class="hint" style="display:block">по заказам {{ fmt(ordBrak) }} кг + отходы {{ fmt(num(WA.v)) }} кг</small></template></div>
   <div class="row"><button class="btn pri" @click="wasteOk">Закончить отчёт</button></div>
   <p class="hint" style="margin-top:12px">Число прибавится к браку за день и попадёт в месячный отчёт. Можно оставить пустым.</p>
  </template>
  <template v-else-if="sheet==='plan'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>План на месяц</b><span></span></div>
   <h2>{{ monthTitle }}</h2>
   <label>План, м²<input v-model="PL.v" :class="{err:PL.err}" inputmode="decimal" enterkeyhint="done" placeholder="например 120000" autocomplete="off" v-focus="true" @input="PL.err=false"></label>
   <p v-if="PL.err" class="hint err">Введите число больше нуля, например 120000</p>
   <p v-else-if="PL.from" class="hint">Подставлен план прошлого месяца. Измените, если нужно.</p>
   <div class="row"><button class="btn pri" @click="planOk">Сохранить</button></div>
   <div v-if="plan" class="row"><button class="btn dng" @click="sure('p',planDel)">{{ armed==='p'?'Нажмите ещё раз':'Убрать план' }}</button></div>
   <p class="hint" style="margin-top:12px">Прогноз считается по темпу с начала месяца. План хранится для каждого месяца отдельно и синхронизируется.</p>
  </template>
  <template v-else-if="sheet==='day'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>{{ D.orig?'Изменить день':'Новый день' }}</b><span></span></div>
   <h2>Гофроагрегат</h2>
   <label>Дата<input type="date" v-model="D.date" :class="{err:D.err==='date'}"></label>
   <label>Произведено, м²<input v-model="D.m2" inputmode="decimal" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='m2'}" v-focus="true"></label>
   <label>Количество заказов<input v-model="D.ord" inputmode="numeric" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='ord'}"></label>
   <label>Количество смен<input v-model="D.sh" inputmode="numeric" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='sh'}"></label>
   <label>Брак, кг<input v-model="D.brak" inputmode="decimal" enterkeyhint="done" autocomplete="off"></label>
   <div class="row"><button class="btn pri" @click="dayOk">Сохранить</button></div>
   <div v-if="D.orig" class="row"><button class="btn dng" @click="sure('d',delDay)">{{ armed==='d'?'Нажмите ещё раз':'Удалить день' }}</button></div>
  </template>
  <template v-else-if="sheet==='sync'">
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>Синхронизация</b><span></span></div>
   <template v-if="!cfg.url">
    <h2>Подключение</h2>
    <label>Адрес базы Firebase или ключ подключения<input v-model="syncInp" autocomplete="off" autocapitalize="off" enterkeyhint="done" v-focus="true"></label>
    <p class="hint">На втором устройстве вставьте ключ, который покажет первое. Пошаговая инструкция лежит в README.txt.</p>
    <div class="row"><button class="btn pri" @click="syncConnect">Подключить</button></div>
   </template>
   <template v-else>
    <h2>{{ syncTitle }}</h2><p class="hint">{{ syncSub }}</p>
    <label style="margin-top:12px">Ключ подключения (вставьте его на другом устройстве)<input :value="syncKey" readonly></label>
    <div class="row"><button class="btn" @click="copy(syncKey)">Скопировать ключ</button></div>
    <div class="row"><button class="btn pri" @click="syncNow(true)">Синхронизировать сейчас</button></div>
    <div class="row"><button class="btn dng" @click="sure('sy',syncOff)">{{ armed==='sy'?'Нажмите ещё раз':'Отключить синхронизацию' }}</button></div>
   </template>
  </template>
  <template v-else-if="sheet==='dayord'">
   <div class="grab"></div>
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>{{ selDay?dayTxt(selDay.date):'' }}</b><span></span></div>
   <h2>Заказы за день</h2>
   <template v-if="selOrders.length">
    <div v-for="(o,i) in selOrders" :key="o.id" class="or"><span class="n">{{ i+1 }}</span><span class="m"><b>{{ o.customer }} {{ o.order }}/{{ o.tech||'-' }}</b><small>{{ o.len }}×{{ o.wid }} · план {{ o.plan }} · факт&nbsp;{{ o.fact||'—' }}<template v-if="brk(o)>0"> · брак {{ fmt(brk(o)) }} кг</template></small></span><span class="a">{{ fmt(area(o)) }} м²</span></div>
    <div class="tot2">Итого: <b>{{ fmt(selOrders.reduce((t,o)=>t+area(o),0)) }} м²</b> · заказов: {{ selOrders.length }}</div>
   </template>
   <p v-else class="hint">За этот день заказов нет. Они берутся из ежедневных отчётов за эту дату.</p>
  </template>
  <template v-else-if="sheet==='inst'">
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>На главный экран</b><span></span></div>
   <h2>{{ isIos?'Safari':'Chrome' }}</h2>
   <ol v-if="isIos" class="steps"><li>Нажмите «Поделиться» внизу экрана.</li><li>Выберите «На экран Домой».</li><li>Нажмите «Добавить».</li></ol>
   <ol v-else class="steps"><li>Откройте меню Chrome: три точки справа вверху.</li><li>Выберите «Установить приложение» или «Добавить на главный экран».</li><li>Подтвердите. Иконка появится на экране.</li></ol>
  </template>
 </div></div>
 <div class="ov" style="z-index:11" :class="{open:calcOpen}" @click="calcOpen=false"></div>
 <div class="g calc" :class="{open:calcOpen}">
  <div class="top2"><button class="ghost" @click="calcOpen=false">Закрыть</button><b>Калькулятор</b><span class="dim"></span></div>
  <div class="cr"><span class="cl">Паддонов</span><Wheel :items="WN" v-model="C.n"/></div>
  <div class="cr"><span class="cl">Стопок</span><Wheel :items="WS" v-model="C.s"/></div>
  <div class="cr"><span class="cl">Формат</span><Wheel class="fm" :items="WF" :w="36" v-model="C.f"/><div class="tk" :class="{off:C.f!=='A'}"><Wheel :items="WT" :w="48" :disabled="C.f!=='A'" v-model="C.t"/><span class="cap">мм</span></div></div>
  <div class="cr"><span class="cl">Высота, см</span><Wheel :items="WH" :w="56" :speed="7" v-model="C.h"/></div>
  <div class="cr" :class="{off:C.n<2}"><span class="cl">Последний, см</span><Wheel :items="WL" :w="56" :speed="7" :disabled="C.n<2" v-model="C.l"/></div>
  <div class="info res">≈ <b>{{ fmt(calcTotal) }}</b> шт<small class="hint" style="display:block">Формат {{ C.f }} · толщина {{ thTxt }} мм</small></div>
  <div class="row"><button class="btn pri" @click="applyCalc">Подставить в «по факту»</button></div>
 </div>
 <div class="g toast" :class="{show:toast.show,big:toast.big}" ref="toastEl" @click="hideToast" @touchstart.stop.passive="tsStart" @touchmove.stop.passive="tsMove" @touchend.stop.passive="tsEnd" @touchcancel.stop.passive="tsCancel" role="status"><template v-if="toast.big"><b class="tt">{{ toast.title }}</b><div v-for="x in toast.rows" :key="x[0]" class="tr"><span>{{ x[0] }}</span><b>{{ x[1] }}</b></div><p v-if="toast.note" class="tnote">{{ toast.note }}</p></template><template v-else>{{ toast.msg }}</template></div>
</Teleport>`};

const app=createApp(App);
app.directive('focus',{mounted(el,b){if(b.value&&el.type!=='date')el.focus({preventScroll:true})}});
app.mount('#app');
</script>
</body>
</html>

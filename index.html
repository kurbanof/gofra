<script>

const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

 for(const [k,r] of rm){const l=lm.get(k);if(!l||(r.u||0)>(l.u||0)){lm.set(k,r);pull=true}}
 for(const [k,l] of lm){const r=rm.get(k);if(!r||(l.u||0)>(r.u||0))push=true}
 return{list:pull?[...lm.values()]:null,push}}

const Pill={props:{items:Array,modelValue:String},emits:['update:modelValue'],
 setup(p){const el=ref(null);let l0=null,w0=null;
  function place(anim){const c=el.value;if(!c)return;const i=p.items.findIndex(x=>x.v===p.modelValue),b=c.querySelectorAll('button')[i],d=c.querySelector('.drop');

const App={components:{Pill,Wheel},
setup(){
 const db=reactive(load()),cfg=reactive(Object.assign({url:'',code:'',last:0},(()=>{try{return JSON.parse(localStorage.getItem(KS))||{}}catch(e){return{}}})()));

 const selDay=computed(()=>mdays.value.find(x=>x.date===mSel.value)||mdays.value[mdays.value.length-1]||null);
 const selOrders=computed(()=>{const d=selDay.value;return d?db.reports.filter(r=>!r.del&&r.date===d.date).sort((a,b)=>(a.u||0)-(b.u||0)).flatMap(r=>r.orders):[]});
 const cum=up=>mdays.value.filter(x=>x.date<=up).reduce((s,x)=>({m2:s.m2+num(x.m2),ord:s.ord+num(x.ord),sh:s.sh+num(x.sh),brak:s.brak+num(x.brak)}),{m2:0,ord:0,sh:0,brak:0});
 const mTot=computed(()=>cum('9999'));
 const mText=computed(()=>{const d=selDay.value;if(!d)return'';const ym=d.date.slice(0,7);
  const blk=(h,o)=>h+'\nКоличество: '+fmt(num(o.m2))+' м²\nЗаказов: '+fmt(num(o.ord))+'\nСмен: '+fmt(num(o.sh))+'\nБрак: '+fmt(num(o.brak))+' кг';
  const ords=selOrders.value.length?'\n\nЗаказы:\n\n'+selOrders.value.map((o,i)=>(i+1)+'. '+o.customer+' '+o.order+'/'+(o.tech||'-')+'\n        '+o.len+'×'+o.wid+'. План '+o.plan+'шт, факт '+o.fact+'шт').join('\n\n'):'';
  return'Гофроагрегат\n\n'+blk((d.date===today()?'За сегодня, ':'За ')+dayTxt(d.date)+':',d)+'\n\n'+blk('За '+MI[+ym.slice(5)-1].toLowerCase()+' '+ym.slice(0,4)+':',cum(d.date))+ords});
 const shiftMonth=n=>{mMonth.value=shiftM(monthKey.value,n);mSel.value=null};
 const dayTotals=r=>{const rs=db.reports.filter(x=>!x.del&&x.date===r.date);return{m2:Math.round(rs.reduce((s,x)=>s+repTotal(x),0)*100)/100,ord:rs.reduce((s,x)=>s+x.orders.length,0)}};
 const finState=computed(()=>{const r=cur.value;if(!r)return'';const e=days.value.find(x=>x.date===r.date);if(!e)return'new';const t=dayTotals(r);return Math.abs(num(e.m2)-t.m2)<.005&&num(e.ord)===t.ord?'ok':'stale'});
 const finLabel=computed(()=>({new:'Закончить отчёт',stale:'Обновить в месячном отчёте',ok:'Сохранено в месячном отчёте ✓'})[finState.value]||'');
 function finishReport(){const r=cur.value;if(!r||!r.orders.length)return;const t=dayTotals(r),m2=String(t.m2),ord=String(t.ord),ex=db.days.find(x=>x.date===r.date);
  if(ex&&!ex.del){ex.m2=m2;ex.ord=ord;ex.u=now()}else if(ex)Object.assign(ex,{m2,ord,sh:'1',brak:'0',del:false,u:now()});else db.days.push({date:r.date,m2,ord,sh:'1',brak:'0',u:now()});
  mMonth.value=r.date.slice(0,7);mSel.value=r.date;say('В месячном отчёте: '+fmt(t.m2)+' м², заказов: '+t.ord)}

 let tt;const say=m=>{toast.msg=m;clearTimeout(tt);tt=setTimeout(()=>{toast.msg=''},3500)};
 async function copy(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(x){}a.remove()}say(ok?'Скопировано':'Не удалось скопировать — выделите текст вручную')}
 const sure=(k,fn)=>{if(armed.value===k){armed.value='';fn()}else{armed.value=k;setTimeout(()=>{if(armed.value===k)armed.value=''},3000)}};

 const show=k=>{sheet.value=k;oc.value++;open.value=true};
 const close=()=>{const a=document.activeElement;if(a&&a.blur)a.blur();open.value=false;calcOpen.value=false};
 function addCust(n){const l=n.toLowerCase(),c=db.customers.find(x=>x.n.toLowerCase()===l);if(c){if(c.del){c.del=false;c.u=now()}}else db.customers.push({n,u:now()})}
 const delCust=n=>{const c=db.customers.find(x=>x.n===n);if(c){c.del=true;c.u=now()}};
 function exportData(){
  const data={app:'gofro-otchet',v:1,t:now(),reports:db.reports.filter(r=>!r.del),days:db.days.filter(x=>!x.del),customers:db.customers.filter(c=>!c.del)};
  if(!data.reports.length&&!data.days.length&&!data.customers.length){say('Пока нечего экспортировать');return}
  const name='otchet-backup-'+today()+'.json';
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);say('Экспорт: '+name)}catch(e){say('Не удалось создать файл')}}
 function importData(d){
  const cnt={reports:0,days:0,customers:0};
  for(const [k,key,clean] of [['reports','id',cleanRep],['days','date',cleanDay],['customers','n',cleanCust]]){
   for(const raw of (Array.isArray(d[k])?d[k]:[])){
    if(raw&&raw.del)continue;const r=clean(raw);if(!r)continue;
    const l=db[k].find(x=>k==='customers'?x.n.toLowerCase()===r.n.toLowerCase():x[key]===r[key]);
    if(!l){db[k].push(Object.assign(r,{u:now()}));cnt[k]++}
    else if(l.del||(k!=='customers'&&r.u>(l.u||0))){Object.assign(l,r,{del:false,u:now()});cnt[k]++}}}
  if(!cur.value&&reports.value.length)db.cur=reports.value[0].id;
  return cnt}
 const pickFile=()=>{if(fileEl.value)fileEl.value.click()};
 async function onFile(e){const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());
   if(!d||typeof d!=='object'||Array.isArray(d)||!(Array.isArray(d.reports)||Array.isArray(d.days)||Array.isArray(d.customers)))throw new Error('format');
   const c=importData(d);
   say(c.reports+c.days+c.customers?'Импорт: отчётов '+c.reports+', дней '+c.days+', заказчиков '+c.customers:'В файле нет новых данных')}
  catch(err){say('Не удалось прочитать файл: нужен файл экспорта (.json)')}}

 function openDate(isNew){dateF.isNew=isNew;dateF.v=isNew?today():cur.value.date;dateF.err=false;show('date')}
 const dropEmpty=()=>{const r=cur.value;if(r&&!r.orders.length){r.del=true;r.u=now()}};
 function dateOk(){if(!dateF.v){dateF.err=true;return}
  dropEmpty();const r={id:uid(),date:dateF.v,orders:[],u:now()};db.reports.push(r);db.cur=r.id;tab.value='rep';db.mode='day';openOrder()}
 function goDate(){const d=dateF.v;if(!d){dateF.err=true;return}
  const same=reports.value.filter(r=>r.date===d).sort((a,b)=>(b.u||0)-(a.u||0));
  if(same.length){if(!cur.value||same[0].id!==cur.value.id)dropEmpty();db.cur=same[0].id}
  else{dropEmpty();const r={id:uid(),date:d,orders:[],u:now()};db.reports.push(r);db.cur=r.id}
  tab.value='rep';db.mode='day';close()}
 function renameDate(){const d=dateF.v,r=cur.value;if(!d){dateF.err=true;return}if(!r)return;
  if(reports.value.some(x=>x.id!==r.id&&x.date===d)){say('За эту дату уже есть отчёт. Нажмите «Показать заказы»');return}
  r.date=d;r.u=now();close()}
 function openReport(id){if(!cur.value||cur.value.id!==id)dropEmpty();db.cur=id;tab.value='rep'}
 function delReport(id){const r=db.reports.find(x=>x.id===id);if(r){r.del=true;r.u=now()}if(db.cur===id)db.cur=null}

 const shownSteps=computed(()=>W.mode==='edit'?STEPS:[STEPS[W.step]]);
 const showArea=computed(()=>W.mode==='edit'||W.step===STEPS.length-1);
 const nextLabel=computed(()=>W.mode==='edit'?'Сохранить':W.step===STEPS.length-1?'Завершить заказ':'Далее');
 const sugs=computed(()=>{const q=(W.o.customer||'').trim().toLowerCase(),l=customers.value;
  const r=q?l.filter(c=>{const s=c.toLowerCase();return s!==q&&s.indexOf(q)>-1}).sort((a,b)=>(a.toLowerCase().indexOf(q)===0?0:1)-(b.toLowerCase().indexOf(q)===0?0:1)||a.localeCompare(b,'ru')):[...l].reverse();return r.slice(0,6)});
 function openOrder(id){const r=cur.value,ex=id&&r.orders.find(x=>x.id===id);
  Object.assign(W,{mode:ex?'edit':'new',step:0,id:id||null,err:'',o:ex?Object.assign({},ex):{customer:'',order:'',tech:'',len:'',wid:'',plan:'',fact:''}});show('order')}
 function next(){
  const bad=shownSteps.value.flatMap(s=>s.f).find(f=>f.k!=='tech'&&!String(W.o[f.k]).trim());
  if(bad){W.err=bad.k;nextTick(()=>{const e=sheetEl.value.querySelector('input.err');e&&e.focus()});return}
  if(W.mode==='new'&&W.step<STEPS.length-1){W.step++;return}
  const o=Object.assign({},W.o),r=cur.value;if(!r)return;
  o.customer=o.customer.trim().replace(/\s+/g,' ');const kn=customers.value.find(c=>c.toLowerCase()===o.customer.toLowerCase());if(kn)o.customer=kn;
  ['order','tech','len','wid','plan','fact'].forEach(k=>{o[k]=String(o[k]).replace(/\s+/g,'')});
  const ex=W.mode==='edit'&&r.orders.find(x=>x.id===W.id);
  if(ex)Object.assign(ex,o);else r.orders.push(Object.assign({id:uid()},o));
  r.u=now();addCust(o.customer);close();say((ex?'Сохранено: ':'Заказ завершён: ')+fmt(area(o))+' м²')}
 const back=()=>{if(W.step>0)W.step--};
 const pick=c=>{W.o.customer=c;if(W.mode==='new')next()};
 const delOrder=()=>{const r=cur.value;r.orders=r.orders.filter(x=>x.id!==W.id);r.u=now();close()};

 function openDay(date){const ex=date&&days.value.find(x=>x.date===date);
  Object.assign(D,{orig:ex?ex.date:null,err:''},ex?{date:ex.date,m2:ex.m2,ord:ex.ord,sh:ex.sh,brak:ex.brak}:{date:today(),m2:'',ord:'',sh:'',brak:''});show('day')}
 function dayOk(){const g=k=>String(D[k]).trim().replace(/\s+/g,''),o={date:g('date'),m2:g('m2'),ord:g('ord'),sh:g('sh'),brak:g('brak')||'0',u:now()};
  const bad=['date','m2','ord','sh'].find(k=>!o[k]);if(bad){D.err=bad;return}
  if(D.orig!==o.date&&days.value.some(x=>x.date===o.date)){say('За эту дату уже есть запись. Откройте её кнопкой «Изменить»');return}
  if(D.orig&&D.orig!==o.date){const old=db.days.find(x=>x.date===D.orig);if(old){old.del=true;old.u=now()}}
  const i=db.days.findIndex(x=>x.date===o.date);if(i>-1)db.days[i]=o;else db.days.push(o);
  mMonth.value=o.date.slice(0,7);mSel.value=o.date;close();say('День сохранён')}
 const delDay=()=>{const x=db.days.find(y=>y.date===D.orig);if(x){x.del=true;x.u=now()}close()};

 const calcTotal=computed(()=>{const per=h=>Math.floor(h*10/TH[C.f]),full=per(C.h),last=C.n>1&&C.l?per(C.l):full;return C.s*((C.n-1)*full+last)});
 function openCalc(){const a=document.activeElement;if(a&&a.blur)a.blur();calcOpen.value=true}
 const applyCalc=()=>{W.o.fact=String(calcTotal.value);calcOpen.value=false;nextTick(()=>{const e=sheetEl.value&&sheetEl.value.querySelector('input');e&&e.focus({preventScroll:true})})};

 const syncKey=computed(()=>cfg.url?'gofro:'+btoa(JSON.stringify({u:cfg.url,c:cfg.code})):'');
 const syncTitle=computed(()=>!cfg.url?'Данные только на этом устройстве':sync.busy?'Синхронизация…':sync.status==='err'?'Ошибка синхронизации':'Данные синхронизируются');
 const syncSub=computed(()=>!cfg.url?'Подключите облачную базу, чтобы отчёты были на всех устройствах':sync.status==='err'?sync.msg:cfg.last?'Последняя синхронизация: '+new Date(cfg.last).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'Ожидание');
 function syncConnect(){const s=syncInp.value.trim();let u='',c='';
  try{if(s.indexOf('gofro:')===0){const k=JSON.parse(atob(s.slice(6)));u=k.u;c=k.c}else if(/^https?:\/\//.test(s)){u=s;c=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(36).padStart(2,'0')).join('')}}catch(e){}
  if(!u||!c){say('Введите адрес базы (https://…) или ключ подключения');return}
  cfg.url=u.replace(/\/+$/,'');cfg.code=c;syncInp.value='';syncNow(true)}
 const syncOff=()=>{cfg.url='';cfg.code='';cfg.last=0;sync.status='';close()};
 async function syncNow(manual){
  if(!cfg.url||!cfg.code||sync.busy)return;sync.busy=true;
  try{const ep=cfg.url+'/'+cfg.code+'.json';
   const r=await fetch(ep,{cache:'no-store'});if(!r.ok)throw new Error('Сервер ответил '+r.status);
   const remote=await r.json();let push=!remote;
   for(const [k,key] of [['reports','id'],['days','date'],['customers','n']]){const m=mergeBy(db[k],remote&&remote[k],key);if(m.list)db[k]=m.list;if(m.push)push=true}
   if(!cur.value&&reports.value.length)db.cur=reports.value[0].id;
   if(push){const w=await fetch(ep,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({reports:db.reports,days:db.days,customers:db.customers,t:now()})});if(!w.ok)throw new Error('Не удалось записать: '+w.status)}
   cfg.last=now();sync.status='ok';if(manual)say('Синхронизировано')}
  catch(e){sync.status='err';sync.msg=String(e.message||e);if(manual)say('Ошибка синхронизации')}
  finally{sync.busy=false}}

 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 const showInst=computed(()=>!standalone&&!instOff.value&&location.protocol.indexOf('http')===0);
 async function doInstall(){if(dp.value){dp.value.prompt();try{await dp.value.userChoice}catch(e){}dp.value=null}else show('inst')}
 const offInst=()=>{instOff.value=true;try{localStorage.setItem('gofro-inst-off','1')}catch(e){}};
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp.value=e});
 window.addEventListener('appinstalled',()=>{instOff.value=true;say('Приложение установлено')});
 const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);

 let tx=0,ty=0,t0=0,tok=false;
 const tStart=e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;t0=Date.now();tok=e.touches.length===1&&!open.value&&!calcOpen.value&&!e.target.closest('input')};
 const tEnd=e=>{if(!tok)return;tok=false;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dy)<Math.abs(dx)*.7&&Date.now()-t0<900){if(dx<0&&db.mode!=='mon')db.mode='mon';else if(dx>0&&db.mode==='mon')db.mode='day'}};
 watch(view,(n,o)=>{tname.value=IDX[n]>IDX[o]?'sl':'sr'});
 let lastY=0,tick=false;
 function onScroll(){if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;const el=scrollEl.value;if(!el)return;const y=el.scrollTop,d=y-lastY;
  if(y<40){topHidden.value=false;lastY=y}else if(d>8){topHidden.value=true;lastY=y}else if(d<-8){topHidden.value=false;lastY=y}})}
 watch(view,()=>{topHidden.value=false;lastY=0;if(scrollEl.value)scrollEl.value.scrollTop=0},{flush:'post'});

 const primary=()=>({date:()=>dateF.isNew?dateOk():goDate(),order:next,day:dayOk,sync:syncConnect})[sheet.value];
 function onKey(e){if((e.key!=='Enter'&&e.keyCode!==13)||e.target.tagName!=='INPUT'||e.target.readOnly)return;e.preventDefault();
  const ins=[...sheetEl.value.querySelectorAll('input:not([type=date])')],i=ins.indexOf(e.target);
  if(i>-1&&i<ins.length-1)ins[i+1].focus();else{const f=primary();f&&f()}}
 const onFocusIn=e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='date')setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},280)};

 const isRoot=computed(()=>!open.value&&!calcOpen.value&&db.mode!=='mon'&&tab.value==='rep');
 let syncT,trapped=false,ignorePop=false;
 const schedule=()=>{clearTimeout(syncT);syncT=setTimeout(syncTrap,40)};
 function syncTrap(){try{if(!isRoot.value&&!trapped){history.pushState({t:1},'');trapped=true}
  else if(isRoot.value&&trapped){ignorePop=true;trapped=false;history.back();setTimeout(()=>{ignorePop=false},700)}}catch(e){}}
 function backStep(){
  if(calcOpen.value){calcOpen.value=false;return}
  if(open.value){if(sheet.value==='order'&&W.mode==='new'&&W.step>0)W.step--;else close();return}
  if(db.mode==='mon'){db.mode='day';return}
  if(tab.value==='his')tab.value='rep'}
 watch(isRoot,schedule);

 let st,dt;
 const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
 watch(db,()=>{clearTimeout(st);st=setTimeout(save,150)},{deep:true});
 watch(cfg,()=>{try{localStorage.setItem(KS,JSON.stringify(cfg))}catch(e){}},{deep:true});
 watch(()=>[db.reports,db.days,db.customers],()=>{clearTimeout(dt);dt=setTimeout(()=>syncNow(false),1500)},{deep:true});
 if(!cur.value&&reports.value.length)db.cur=reports.value[0].id;

 onMounted(()=>{
  const vv=window.visualViewport;let baseH=vv?vv.height:innerHeight,prev=0,bt;
  const upd=()=>{const h=vv?vv.height:innerHeight,r=document.documentElement,a=document.activeElement;
   if(!(a&&a.tagName==='INPUT')||h>baseH)baseH=h;const real=Math.max(0,baseH-h);
   let off=vv?Math.max(0,innerHeight-vv.height-vv.offsetTop):0;if(off<90)off=0;
   r.style.setProperty('--kb',off+'px');r.style.setProperty('--vh',h+'px');r.classList.toggle('kbd',real>90);
   if(prev>90&&real<=90){clearTimeout(bt);bt=setTimeout(()=>{const b=document.activeElement;if(b&&b.tagName==='INPUT'&&baseH-(vv?vv.height:innerHeight)<=90)b.blur()},160)}
   prev=real>90?real:0};
  if(vv){vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd)}addEventListener('resize',upd);upd();
  window.addEventListener('popstate',()=>{if(ignorePop){ignorePop=false;return}trapped=false;const a=document.activeElement;if(a&&a.tagName==='INPUT')a.blur();else backStep();schedule()});
  const go=()=>{if(document.visibilityState==='visible')syncNow(false)};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save();go()});
  addEventListener('online',go);setInterval(go,60000);syncNow(false);
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{})});

 return{db,cfg,sync,toast,armed,tab,tname,scrollEl,sheetEl,sheet,open,oc,calcOpen,syncInp,W,dateF,D,C,mMonth,mSel,
  reports,cur,repTotal,total,customers,view,repText,monthTitle,mdays,mdaysDesc,selDay,mTot,mText,shiftMonth,finState,finLabel,finishReport,exportData,pickFile,onFile,fileEl,topHidden,onScroll,
  copy,sure,show,close,delCust,openDate,dateOk,goDate,renameDate,openReport,delReport,shownSteps,showArea,nextLabel,sugs,openOrder,next,back,pick,delOrder,
  openDay,dayOk,delDay,calcTotal,openCalc,applyCalc,syncKey,syncTitle,syncSub,syncConnect,syncOff,syncNow,showInst,doInstall,offInst,isIos,
  tStart,tEnd,onKey,onFocusIn,STEPS,MODES,TABS,WN,WS,WF,WH,WL,TH,fmt,num,dm,dayTxt,area}},
template:`
<div class="shell" @touchstart.passive="tStart" @touchend.passive="tEnd">
 <div class="top" :class="{hide:topHidden}"><Pill :items="MODES" v-model="db.mode"/></div>
 <main class="scroll" ref="scrollEl" @scroll.passive="onScroll"><div class="wrap">
  <div v-if="showInst" class="g inst"><span>Добавьте приложение на главный экран</span><button class="btn sm pri" @click="doInstall">Добавить</button><button class="x" @click="offInst" aria-label="Скрыть">×</button></div>
  <Transition :name="tname" mode="out-in">
   <section v-if="view==='rep'" key="rep">
    <template v-if="cur">
     <div class="head"><h1><button class="dt" @click="openDate(false)" aria-label="Изменить дату">План на {{ dm(cur.date) }}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button></h1><button class="btn sm" @click="openDate(true)">Новый отчёт</button></div>
     <div class="g total"><span class="tl">Произведено за смену</span><strong class="tn">{{ fmt(total) }}<small>м²</small></strong></div>
     <button class="btn pri big" @click="openOrder()">Добавить заказ</button>
     <TransitionGroup name="li" tag="div">
      <button v-for="(o,i) in cur.orders" :key="o.id" class="g oc" @click="openOrder(o.id)"><span class="n">{{ i+1 }}</span><span class="m"><b>{{ o.customer }} {{ o.order }}/{{ o.tech||'-' }}</b><small>{{ o.len }}×{{ o.wid }} · план {{ o.plan }} · факт {{ o.fact }}</small></span><span class="a">{{ fmt(area(o)) }} м²</span></button>
     </TransitionGroup>
     <button v-if="cur.orders.length" class="btn big fin" @click="finishReport">{{ finLabel }}</button>
     <p v-if="!cur.orders.length" class="mut">Заказов пока нет.</p>
     <div v-if="cur.orders.length" class="g prev"><pre>{{ repText }}</pre><label class="chk"><input type="checkbox" v-model="db.wa"> Добавить м² в конец списка</label><button class="btn pri big" @click="copy(repText)">Скопировать список</button></div>
    </template>
    <div v-else class="g empty"><h1>Отчёт по смене</h1><p>Приложение спросит дату, а затем по шагам: заказчика, номера, размеры и количество.</p><button class="btn pri big" @click="openDate(true)">Начать отчёт</button></div>
   </section>
   <section v-else-if="view==='his'" key="his">
    <div class="head"><h1>История</h1></div>
    <TransitionGroup name="li" tag="div">
     <div v-for="r in reports" :key="r.id" class="g item"><div class="t" @click="openReport(r.id)"><b>{{ dm(r.date) }}.{{ r.date.slice(0,4) }}</b><small>Заказов: {{ r.orders.length }}</small></div><span class="a">{{ fmt(repTotal(r)) }} м²</span><button class="btn sm dng" @click="sure('r'+r.id,()=>delReport(r.id))">{{ armed==='r'+r.id?'Нажмите ещё раз':'Удалить' }}</button></div>
    </TransitionGroup>
    <p v-if="!reports.length" class="mut">Здесь появятся прошлые отчёты.</p>
    <h2>Синхронизация</h2>
    <div class="g sy"><div class="m"><b>{{ syncTitle }}</b><small>{{ syncSub }}</small></div><button class="btn sm" @click="show('sync')">{{ cfg.url?'Настроить':'Подключить' }}</button></div>
    <div class="g sy io"><div class="m"><b>Резервная копия</b></div><button class="btn sm" @click="exportData">Экспорт</button><button class="btn sm" @click="pickFile">Импорт</button><input type="file" ref="fileEl" accept=".json,application/json,text/plain" hidden @change="onFile"></div>
    <h2>Сохранённые заказчики</h2>
    <TransitionGroup name="li" tag="div">
     <div v-for="c in customers" :key="c" class="g item"><div class="t"><b>{{ c }}</b></div><button class="btn sm dng" @click="sure('c'+c,()=>delCust(c))">{{ armed==='c'+c?'Нажмите ещё раз':'Удалить' }}</button></div>
    </TransitionGroup>
    <p v-if="!customers.length" class="mut">Имена появятся после первого заказа.</p>
   </section>
   <section v-else key="mon">
    <div class="head"><div class="mn"><button class="btn sm" @click="shiftMonth(-1)" aria-label="Предыдущий месяц">‹</button><h1>{{ monthTitle }}</h1><button class="btn sm" @click="shiftMonth(1)" aria-label="Следующий месяц">›</button></div></div>
    <div class="g mtot"><b>Гофроагрегат за месяц</b><div class="mg"><span>{{ fmt(mTot.m2) }}<small>м²</small></span><span>{{ fmt(mTot.ord) }}<small>заказов</small></span><span>{{ fmt(mTot.sh) }}<small>смен</small></span><span>{{ fmt(mTot.brak) }}<small>кг брака</small></span></div></div>
    <button class="btn pri big" @click="openDay()">Добавить день</button>
    <div v-if="selDay" class="g prev"><pre class="full">{{ mText }}</pre><button class="btn pri big" @click="copy(mText)">Скопировать отчёт</button></div>
    <h2 v-if="mdays.length">Дни</h2>
    <TransitionGroup name="li" tag="div">
     <div v-for="x in mdaysDesc" :key="x.date" class="g dc" :class="{sel:selDay&&x.date===selDay.date}" @click="mSel=x.date"><div class="m"><b>{{ dayTxt(x.date) }}</b><small>{{ fmt(num(x.m2)) }} м² · {{ x.ord }} зак. · {{ x.sh }} см.</small><small>брак {{ fmt(num(x.brak)) }} кг</small></div><button class="btn sm" @click.stop="openDay(x.date)">Изменить</button></div>
    </TransitionGroup>
    <p v-if="!mdays.length" class="mut">За этот месяц данных пока нет.</p>
   </section>
  </Transition>
 </div></main>
 <div class="dock" :class="{on:db.mode==='day'}"><Transition name="dock"><Pill v-show="db.mode==='day'" class="nav" :items="TABS" v-model="tab"/></Transition></div>
</div>
<Teleport to="body">
 <div class="ov" :class="{open:open}" @click="close"></div>
 <div class="g sheet" :class="{open:open}" ref="sheetEl" @focusin="onFocusIn" @keydown="onKey"><div :key="oc">
  <template v-if="sheet==='date'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b></b><span></span></div>
   <h2>{{ dateF.isNew?'Дата нового отчёта':'Выберите дату' }}</h2>
   <label>Дата смены<input type="date" v-model="dateF.v" :class="{err:dateF.err}"></label>
   <p v-if="!dateF.isNew" class="hint">Откроется отчёт за выбранную дату. Если его ещё нет, начнётся новый.</p>
   <div class="row"><button class="btn pri" @click="dateF.isNew?dateOk():goDate()">{{ dateF.isNew?'Далее':'Показать заказы' }}</button></div>
   <div v-if="!dateF.isNew" class="row"><button class="btn" @click="renameDate">Изменить дату этого отчёта</button></div>
  </template>
  <template v-else-if="sheet==='order'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>{{ W.mode==='edit'?'Изменить заказ':'Заказ №'+(cur?cur.orders.length+1:1) }}</b><span class="dim">{{ W.mode==='edit'?'':(W.step+1)+'/'+STEPS.length }}</span></div>
   <div v-if="W.mode==='new'" class="bar"><i :style="{transform:'scaleX('+((W.step+1)/STEPS.length)+')'}"></i></div>
   <div v-for="(s,si) in shownSteps" :key="s.t">
    <h2>{{ s.t }}</h2>
    <label v-for="(f,i) in s.f" :key="f.k">{{ f.l }}
     <span class="inw"><input v-model="W.o[f.k]" :class="{err:W.err===f.k}" :inputmode="f.m" :enterkeyhint="f.k==='fact'?'done':'next'" :autocapitalize="f.k==='customer'?'words':'off'" autocomplete="off" v-focus="si===0&&i===0" @input="W.err=''">
     <button v-if="f.k==='fact'" type="button" class="calcb" @click="openCalc" aria-label="Калькулятор заготовок"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" stroke-width="2.4"/></svg></button></span>
    </label>
    <div v-if="s.f[0].k==='customer'" class="sug"><button v-for="c in sugs" :key="c" type="button" class="chip" @click="pick(c)">{{ c }}</button></div>
   </div>
   <div v-if="showArea" class="info">Площадь: <b>{{ fmt(area(W.o)) }} м²</b> (длина × ширина × факт)</div>
   <div class="row"><button v-if="W.mode==='new'&&W.step>0" class="btn" @click="back">Назад</button><button class="btn pri" @click="next">{{ nextLabel }}</button></div>
   <div v-if="W.mode==='edit'" class="row"><button class="btn dng" @click="sure('o',delOrder)">{{ armed==='o'?'Нажмите ещё раз':'Удалить заказ' }}</button></div>
  </template>
  <template v-else-if="sheet==='day'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>{{ D.orig?'Изменить день':'Новый день' }}</b><span></span></div>
   <h2>Гофроагрегат</h2>
   <label>Дата<input type="date" v-model="D.date" :class="{err:D.err==='date'}"></label>
   <label>Произведено, м²<input v-model="D.m2" inputmode="decimal" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='m2'}" v-focus="true"></label>
   <label>Количество заказов<input v-model="D.ord" inputmode="numeric" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='ord'}"></label>
   <label>Количество смен<input v-model="D.sh" inputmode="numeric" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='sh'}"></label>
   <label>Брак, кг<input v-model="D.brak" inputmode="decimal" enterkeyhint="done" autocomplete="off"></label>
   <div class="row"><button class="btn pri" @click="dayOk">Сохранить</button></div>
   <div v-if="D.orig" class="row"><button class="btn dng" @click="sure('d',delDay)">{{ armed==='d'?'Нажмите ещё раз':'Удалить день' }}</button></div>
  </template>
  <template v-else-if="sheet==='sync'">
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>Синхронизация</b><span></span></div>
   <template v-if="!cfg.url">
    <h2>Подключение</h2>
    <label>Адрес базы Firebase или ключ подключения<input v-model="syncInp" autocomplete="off" autocapitalize="off" enterkeyhint="done" v-focus="true"></label>
    <p class="hint">На втором устройстве вставьте ключ, который покажет первое. Пошаговая инструкция лежит в README.txt.</p>
    <div class="row"><button class="btn pri" @click="syncConnect">Подключить</button></div>
   </template>
   <template v-else>
    <h2>{{ syncTitle }}</h2><p class="hint">{{ syncSub }}</p>
    <label style="margin-top:12px">Ключ подключения (вставьте его на другом устройстве)<input :value="syncKey" readonly></label>
    <div class="row"><button class="btn" @click="copy(syncKey)">Скопировать ключ</button></div>
    <div class="row"><button class="btn pri" @click="syncNow(true)">Синхронизировать сейчас</button></div>
    <div class="row"><button class="btn dng" @click="sure('sy',syncOff)">{{ armed==='sy'?'Нажмите ещё раз':'Отключить синхронизацию' }}</button></div>
   </template>
  </template>
  <template v-else-if="sheet==='inst'">
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>На главный экран</b><span></span></div>
   <h2>{{ isIos?'Safari':'Chrome' }}</h2>
   <ol v-if="isIos" class="steps"><li>Нажмите «Поделиться» внизу экрана.</li><li>Выберите «На экран Домой».</li><li>Нажмите «Добавить».</li></ol>
   <ol v-else class="steps"><li>Откройте меню Chrome: три точки справа вверху.</li><li>Выберите «Установить приложение» или «Добавить на главный экран».</li><li>Подтвердите. Иконка появится на экране.</li></ol>
  </template>
 </div></div>
 <div class="ov" style="z-index:11" :class="{open:calcOpen}" @click="calcOpen=false"></div>
 <div class="g calc" :class="{open:calcOpen}">
  <div class="top2"><button class="ghost" @click="calcOpen=false">Закрыть</button><b>Калькулятор</b><span class="dim"></span></div>
  <div class="whr">
   <Wheel label="Паддонов" :items="WN" v-model="C.n"/><Wheel label="Стопок" :items="WS" v-model="C.s"/><Wheel label="Формат" :items="WF" v-model="C.f"/><Wheel label="Высота" :items="WH" v-model="C.h"/><Wheel v-if="C.n>1" label="Последний" :items="WL" v-model="C.l"/>
  </div>
  <div class="info res">≈ <b>{{ fmt(calcTotal) }}</b> шт<small class="hint" style="display:block">Формат {{ C.f }} ≈ {{ String(TH[C.f]).replace('.',',') }} мм · высота стопки в см</small></div>
  <div class="row"><button class="btn pri" @click="applyCalc">Подставить в «по факту»</button></div>
 </div>
 <div class="g toast" :class="{show:toast.msg}">{{ toast.msg }}</div>
</Teleport>`};

const app=createApp(App);
app.directive('focus',{mounted(el,b){if(b.value&&el.type!=='date')el.focus({preventScroll:true})}});
app.mount('#app');
</script>
</body>
</html>

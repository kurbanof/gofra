    <div class="head"><div class="mn"><button class="btn sm" @click="shiftMonth(-1)" aria-label="Предыдущий месяц">‹</button><h1>{{ monthTitle }}</h1><button class="btn sm" @click="shiftMonth(1)" aria-label="Следующий месяц">›</button></div></div>
    <div class="g mtot"><b>Гофроагрегат за месяц</b><div class="mg"><span>{{ fmt(mTot.m2) }}<small>м²</small></span><span>{{ fmt(mTot.ord) }}<small>заказов</small></span><span>{{ fmt(mTot.sh) }}<small>смен</small></span><span>{{ fmt(mTot.brak) }}<small>кг брака</small></span></div></div>
    <button class="btn pri big" @click="openDay()">Добавить день</button>
    <div v-if="selDay" class="g prev"><pre class="full">{{ mText }}</pre><button class="btn pri big" @click="copy(mText)">Скопировать отчёт</button></div>
    <h2 v-if="mdays.length">Дни</h2>
    <TransitionGroup name="li" tag="div">
     <div v-for="x in mdaysDesc" :key="x.date" class="g dc" :class="{sel:selDay&&x.date===selDay.date}" @click="onDay(x.date)"><div class="m"><b>{{ dayTxt(x.date) }}</b><small>{{ fmt(num(x.m2)) }} м² · {{ x.ord }} зак. · {{ x.sh }} см.</small><small>брак {{ fmt(num(x.brak)) }} кг</small></div><button class="btn sm" @click.stop="openDay(x.date)">Изменить</button></div>
    </TransitionGroup>
    <p v-if="!mdays.length" class="mut">За этот месяц данных пока нет.</p>
   </section>
  </Transition>
 </div></main>
 <div class="dock" :class="{on:db.mode==='day'}"><Transition name="dock"><Pill v-show="db.mode==='day'" class="nav" :items="TABS" v-model="tab"/></Transition></div>
</div>
<Teleport to="body">
 <div class="ov" :class="{open:open}" @click="close"></div>
 <div class="g sheet" :class="{open:open,drag:dragging}" ref="sheetEl" @focusin="onFocusIn" @keydown="onKey" @touchstart.passive="shStart" @touchmove="shMove" @touchend="shEnd" @touchcancel="shCancel"><div :key="oc">
  <template v-if="sheet==='date'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b></b><span></span></div>
   <h2>{{ dateF.isNew?'Дата нового отчёта':'Выберите дату' }}</h2>
   <label>Дата смены<input type="date" v-model="dateF.v" :class="{err:dateF.err}"></label>
   <p v-if="!dateF.isNew" class="hint">Покажем заказы за выбранную дату. Если их нет, можно начать отчёт.</p>
   <div class="row"><button class="btn pri" @click="dateF.isNew?dateOk():goDate()">{{ dateF.isNew?'Далее':'Показать заказы' }}</button></div>
   <div v-if="!dateF.isNew&&cur" class="row"><button class="btn" @click="renameDate">Изменить дату этого отчёта</button></div>
   <div v-if="dateF.isNew" class="row"><button class="btn" @click="openImport">Импорт из буфера обмена</button></div>
  </template>
  <template v-else-if="sheet==='imp'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>Импорт из буфера</b><span></span></div>
   <label style="margin-top:10px">Текст отчёта<textarea ref="impEl" v-model="impText" rows="4" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Вставьте сюда текст: «План на 05.10 … По факту …»"></textarea></label>
   <p v-if="impErr&&!impText" class="hint err">{{ impErr }}</p>
   <div v-if="impText.trim()" class="imp">
    <label>Дата отчёта<input type="date" :value="impDateEff" @input="impDt=$event.target.value"></label>
    <div v-for="o in impOrders" :key="o.n" class="or"><span class="n">{{ o.n }}</span><span class="m"><b>{{ o.customer }} {{ o.order }}/{{ o.tech||'-' }}</b><small>{{ o.len }}×{{ o.wid }} · план {{ o.plan }} · факт {{ o.fact===''?'—':o.fact }}</small><small v-if="o.was!==o.customer" class="fix">исправлено по списку, было: {{ o.was }}</small></span><span class="a">{{ fmt(area(o)) }} м²</span></div>
    <p v-for="b in imp.bad" :key="'b'+b.n" class="hint err">№{{ b.n }} не разобран: «{{ b.raw }}»</p>
    <p v-for="t in impNotes" :key="t" class="hint" style="margin:6px 0">{{ t }}</p>
    <p v-if="!impOrders.length" class="hint err">Не нашёл ни одного заказа. Проверьте текст.</p>
    <div class="stk"><div v-if="impOrders.length" class="tot2">Итого: <b>{{ fmt(impM2) }} м²</b> · заказов: {{ impOrders.length }}</div><div class="row"><button class="btn pri" :disabled="!impOrders.length" @click="importGo">Создать отчёт</button></div></div>
   </div>
  </template>
  <template v-else-if="sheet==='impdup'">
   <div class="top2"><button class="ghost" @click="show('imp')">Назад</button><b>Отчёт уже есть</b><span></span></div>
   <h2>За {{ dayTxt(impDateEff) }} отчёт уже есть</h2>
   <div class="tot2">В приложении: <b>{{ dupInfo.n }}</b> зак., <b>{{ fmt(dupInfo.m2) }} м²</b><br>Из буфера: <b>{{ impOrders.length }}</b> зак., <b>{{ fmt(impM2) }} м²</b></div>
   <div class="row"><button class="btn dng" @click="applyImport('replace')">Заменить</button><button class="btn pri" @click="applyImport('merge')">Объединить</button></div>
   <div class="row"><button class="btn" @click="close">Отмена</button></div>
   <p class="hint" style="margin-top:12px">Заменить: прежний отчёт за эту дату удалится. Объединить: новые заказы добавятся к нему, одинаковые пропустятся.</p>
  </template>
  <template v-else-if="sheet==='order'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>{{ W.mode==='edit'?'Изменить заказ':'Заказ №'+(cur?cur.orders.length+1:1) }}</b><span class="dim">{{ W.mode==='edit'?'':(W.step+1)+'/'+STEPS.length }}</span></div>
   <div v-if="W.mode==='new'" class="bar"><i :style="{transform:'scaleX('+((W.step+1)/STEPS.length)+')'}"></i></div>
   <div v-for="(s,si) in shownSteps" :key="s.t">
    <h2>{{ s.t }}</h2>
    <label v-for="(f,i) in s.f" :key="f.k">{{ f.l }}
     <span class="inw"><input v-model="W.o[f.k]" :class="{err:W.err===f.k}" :inputmode="f.m" :enterkeyhint="f.k==='fact'?'done':'next'" :autocapitalize="f.k==='customer'?'words':'off'" autocomplete="off" v-focus="si===0&&i===0" @input="W.err=''">
     <button v-if="f.k==='fact'" type="button" class="calcb" @click="openCalc" aria-label="Калькулятор заготовок"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" stroke-width="2.4"/></svg></button></span>
    </label>
    <div v-if="s.f[0].k==='customer'" class="sug"><button v-for="c in sugs" :key="c" type="button" class="chip" @click="pick(c)">{{ c }}</button></div>
   </div>
   <div v-if="showArea" class="info">Площадь: <b>{{ fmt(area(W.o)) }} м²</b> (длина × ширина × факт)</div>
   <div class="row"><button v-if="W.mode==='new'&&W.step>0" class="btn" @click="back">Назад</button><button class="btn pri" @click="next">{{ nextLabel }}</button></div>
   <div v-if="W.mode==='edit'" class="row"><button class="btn dng" @click="sure('o',delOrder)">{{ armed==='o'?'Нажмите ещё раз':'Удалить заказ' }}</button></div>
  </template>
  <template v-else-if="sheet==='day'">
   <div class="top2"><button class="ghost" @click="close">Отмена</button><b>{{ D.orig?'Изменить день':'Новый день' }}</b><span></span></div>
   <h2>Гофроагрегат</h2>
   <label>Дата<input type="date" v-model="D.date" :class="{err:D.err==='date'}"></label>
   <label>Произведено, м²<input v-model="D.m2" inputmode="decimal" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='m2'}" v-focus="true"></label>
   <label>Количество заказов<input v-model="D.ord" inputmode="numeric" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='ord'}"></label>
   <label>Количество смен<input v-model="D.sh" inputmode="numeric" enterkeyhint="next" autocomplete="off" :class="{err:D.err==='sh'}"></label>
   <label>Брак, кг<input v-model="D.brak" inputmode="decimal" enterkeyhint="done" autocomplete="off"></label>
   <div class="row"><button class="btn pri" @click="dayOk">Сохранить</button></div>
   <div v-if="D.orig" class="row"><button class="btn dng" @click="sure('d',delDay)">{{ armed==='d'?'Нажмите ещё раз':'Удалить день' }}</button></div>
  </template>
  <template v-else-if="sheet==='sync'">
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>Синхронизация</b><span></span></div>
   <template v-if="!cfg.url">
    <h2>Подключение</h2>
    <label>Адрес базы Firebase или ключ подключения<input v-model="syncInp" autocomplete="off" autocapitalize="off" enterkeyhint="done" v-focus="true"></label>
    <p class="hint">На втором устройстве вставьте ключ, который покажет первое. Пошаговая инструкция лежит в README.txt.</p>
    <div class="row"><button class="btn pri" @click="syncConnect">Подключить</button></div>
   </template>
   <template v-else>
    <h2>{{ syncTitle }}</h2><p class="hint">{{ syncSub }}</p>
    <label style="margin-top:12px">Ключ подключения (вставьте его на другом устройстве)<input :value="syncKey" readonly></label>
    <div class="row"><button class="btn" @click="copy(syncKey)">Скопировать ключ</button></div>
    <div class="row"><button class="btn pri" @click="syncNow(true)">Синхронизировать сейчас</button></div>
    <div class="row"><button class="btn dng" @click="sure('sy',syncOff)">{{ armed==='sy'?'Нажмите ещё раз':'Отключить синхронизацию' }}</button></div>
   </template>
  </template>
  <template v-else-if="sheet==='dayord'">
   <div class="grab"></div>
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>{{ selDay?dayTxt(selDay.date):'' }}</b><span></span></div>
   <h2>Заказы за день</h2>
   <template v-if="selOrders.length">
    <div v-for="(o,i) in selOrders" :key="o.id" class="or"><span class="n">{{ i+1 }}</span><span class="m"><b>{{ o.customer }} {{ o.order }}/{{ o.tech||'-' }}</b><small>{{ o.len }}×{{ o.wid }} · план {{ o.plan }} · факт {{ o.fact }}</small></span><span class="a">{{ fmt(area(o)) }} м²</span></div>
    <div class="tot2">Итого: <b>{{ fmt(selOrders.reduce((t,o)=>t+area(o),0)) }} м²</b> · заказов: {{ selOrders.length }}</div>
   </template>
   <p v-else class="hint">За этот день заказов нет. Они берутся из ежедневных отчётов за эту дату.</p>
  </template>
  <template v-else-if="sheet==='inst'">
   <div class="top2"><button class="ghost" @click="close">Закрыть</button><b>На главный экран</b><span></span></div>
   <h2>{{ isIos?'Safari':'Chrome' }}</h2>
   <ol v-if="isIos" class="steps"><li>Нажмите «Поделиться» внизу экрана.</li><li>Выберите «На экран Домой».</li><li>Нажмите «Добавить».</li></ol>
   <ol v-else class="steps"><li>Откройте меню Chrome: три точки справа вверху.</li><li>Выберите «Установить приложение» или «Добавить на главный экран».</li><li>Подтвердите. Иконка появится на экране.</li></ol>
  </template>
 </div></div>
 <div class="ov" style="z-index:11" :class="{open:calcOpen}" @click="calcOpen=false"></div>
 <div class="g calc" :class="{open:calcOpen}">
  <div class="top2"><button class="ghost" @click="calcOpen=false">Закрыть</button><b>Калькулятор</b><span class="dim"></span></div>
  <div class="cr"><span class="cl">Паддонов</span><Wheel :items="WN" v-model="C.n"/></div>
  <div class="cr"><span class="cl">Стопок</span><Wheel :items="WS" v-model="C.s"/></div>
  <div class="cr"><span class="cl">Формат</span><Wheel class="fm" :items="WF" :w="36" v-model="C.f"/><div class="tk" :class="{off:C.f!=='A'}"><Wheel :items="WT" :w="48" :disabled="C.f!=='A'" v-model="C.t"/><span class="cap">мм</span></div></div>
  <div class="cr"><span class="cl">Высота, см</span><Wheel :items="WH" :w="56" :speed="7" v-model="C.h"/></div>
  <div class="cr" :class="{off:C.n<2}"><span class="cl">Последний, см</span><Wheel :items="WL" :w="56" :speed="7" :disabled="C.n<2" v-model="C.l"/></div>
  <div class="info res">≈ <b>{{ fmt(calcTotal) }}</b> шт<small class="hint" style="display:block">Формат {{ C.f }} · толщина {{ thTxt }} мм</small></div>
  <div class="row"><button class="btn pri" @click="applyCalc">Подставить в «по факту»</button></div>
 </div>
 <div class="g toast" :class="{show:toast.msg}">{{ toast.msg }}</div>
</Teleport>`};

const app=createApp(App);
app.directive('focus',{mounted(el,b){if(b.value&&el.type!=='date')el.focus({preventScroll:true})}});
app.mount('#app');
</script>
</body>
</html>
